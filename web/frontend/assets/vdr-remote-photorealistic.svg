<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1220" role="img" aria-label="Fotorealistische VDR-Fernbedienung">
<defs>
  <linearGradient id="shell" x2="1" y2="1"><stop stop-color="#55585b"/><stop offset=".14" stop-color="#303235"/><stop offset=".58" stop-color="#17191c"/><stop offset="1" stop-color="#070809"/></linearGradient>
  <radialGradient id="shine" cx=".33" cy=".02" r=".95"><stop stop-color="#fff" stop-opacity=".23"/><stop offset=".22" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>
  <linearGradient id="key" x2="1" y2="1"><stop stop-color="#686b70"/><stop offset=".16" stop-color="#3d4045"/><stop offset=".58" stop-color="#202226"/><stop offset="1" stop-color="#08090b"/></linearGradient>
  <linearGradient id="keyRed" x2="1" y2="1"><stop stop-color="#ff7777"/><stop offset=".4" stop-color="#dc3030"/><stop offset="1" stop-color="#7d0c12"/></linearGradient>
  <linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6565"/><stop offset="1" stop-color="#980d18"/></linearGradient>
  <linearGradient id="green" x2="1" y2="1"><stop stop-color="#5ee88e"/><stop offset="1" stop-color="#08783b"/></linearGradient>
  <linearGradient id="yellow" x2="1" y2="1"><stop stop-color="#fff27b"/><stop offset="1" stop-color="#b98a00"/></linearGradient>
  <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#74c4ff"/><stop offset="1" stop-color="#075da8"/></linearGradient>
  <pattern id="texture" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 8 8 0M5 9 9 5" stroke="#fff" stroke-opacity=".018" stroke-width=".8"/><circle cx="2" cy="2" r=".45" fill="#000" opacity=".18"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="1.5" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".78"/></filter>
  <symbol id="button" viewBox="0 0 100 50">
    <rect x="2" y="6" width="96" height="42" rx="20" fill="#000" opacity=".72"/>
    <rect x="1" y="1" width="96" height="42" rx="20" fill="url(#key)" stroke="#050608" stroke-width="2"/>
    <path d="M16 5H82" stroke="#fff" stroke-opacity=".24" stroke-linecap="round"/>
  </symbol>
  <symbol id="button-red" viewBox="0 0 100 50">
    <rect x="2" y="6" width="96" height="42" rx="20" fill="#000" opacity=".72"/>
    <rect x="1" y="1" width="96" height="42" rx="20" fill="url(#keyRed)" stroke="#050608" stroke-width="2"/>
    <path d="M16 5H82" stroke="#fff" stroke-opacity=".24" stroke-linecap="round"/>
  </symbol>
  <symbol id="circle" viewBox="0 0 100 100">
    <circle cx="52" cy="56" r="46" fill="#000" opacity=".72"/>
    <circle cx="50" cy="50" r="46" fill="url(#key)" stroke="#050608" stroke-width="2"/>
    <path d="M25 22Q50 8 75 22" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="2"/>
  </symbol>
  <style>
    .label{fill:#f8fafc;font-family:Arial,sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#000;stroke-width:1.1}
    .small{font-size:12px} .large{font-size:24px}
    .tiny{font-size:10px;letter-spacing:1.5px}
    .sub{fill:#aab4c2;font-family:Arial,sans-serif;font-size:11px;font-weight:700;text-anchor:middle;letter-spacing:2px}
    .icon{fill:#f8fafc;stroke:#000;stroke-width:1.2;paint-order:stroke}
  </style>
</defs>
