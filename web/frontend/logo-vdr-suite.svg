      <path d="M293 63 A29 29 0 0 1 322 92" stroke="url(#vdrBlue)" stroke-width="12"/>
      <path d="M293 86 A6 6 0 0 1 299 92" stroke="url(#vdrBlue)" stroke-width="12"/>
      <path d="M55 69 H31" stroke="#64748b" stroke-width="4"/>
