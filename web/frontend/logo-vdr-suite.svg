<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" role="img" aria-labelledby="title desc">
  <title id="title">vdr-suite logo</title>
  <desc id="desc">VDR-Suite wordmark with a connected TV play icon and live signal arcs.</desc>
  <defs>
