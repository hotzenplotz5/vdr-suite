      <path d="M55 113 H43 L33 124 H17" stroke="#64748b" stroke-width="4"/>
    </g>
    <rect x="10" y="58" width="18" height="18" rx="4" fill="url(#vdrBlue)"/>
    <rect x="10" y="80" width="18" height="18" rx="4" fill="url(#vdrBlue)"/>
    <rect x="10" y="113" width="18" height="18" rx="4" fill="url(#vdrBlue)"/>
    <path d="M151 77 C151 69 160 64 167 69 L211 95 C218 99 218 109 211 113 L167 139 C160 144 151 139 151 131 Z" fill="url(#vdrBlue)"/>
