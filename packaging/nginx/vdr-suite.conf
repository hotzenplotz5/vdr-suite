# VDR-Suite public-origin proxy for inclusion inside an existing Nginx server block.
# Installing this file does not activate it; the site owner must include it explicitly.

location = /vdr-suite {
    return 308 /vdr-suite/frontend/;
}

location = /vdr-suite/ {
    return 308 /vdr-suite/frontend/;
}

location = /vdr-suite/frontend {
    return 308 /vdr-suite/frontend/;
}

location ^~ /vdr-suite/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /vdr-suite;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect off;

    proxy_cookie_path / /vdr-suite/;
    proxy_pass http://127.0.0.1:18080/;
}
