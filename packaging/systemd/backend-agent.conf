# Public Control-Plane HTTPS origin. No provider URL belongs here.
CONTROL_PLANE_URL=https://control-plane.example.invalid
BACKEND_ID=default
IDENTITY_PATH=/var/lib/vdr-suite/backend-agent/identity
ENROLLMENT_PATH=/var/lib/vdr-suite/backend-agent/enrollment
CA_CERTIFICATE_PATH=
SOFTWARE_VERSION=vdr-suite-backend-agent/1

# Read-only facts only. The packaged default publishes backend health only.
# To opt in to local Channel observations, add channels-conf to ADAPTERS and
# channels to OBSERVATION_DOMAINS together. No fallback source is selected.
ADAPTERS=
OBSERVATION_DOMAINS=backend-health
CHANNELS_CONF_PATH=/var/lib/vdr/channels.conf
COMMAND_STATE_PATH=/var/lib/vdr-suite/backend-agent/commands.state

# Native Timer commands and Recording marks mutation are advertised only after
# their loopback SuiteBridge capabilities are discovered as enabled with a
# current provider fence. Recording marks uses its own logical provider identity
# so its capability revision cannot collide with the Timer provider facts.
SUITEBRIDGE_HOST=127.0.0.1
SUITEBRIDGE_PORT=6419
COMMAND_TYPES=vdr.timer.create,vdr.timer.update,vdr.timer.toggle,vdr.timer.delete,vdr.recording.marks.modify

HEARTBEAT_INTERVAL_SECONDS=30
RECONNECT_INITIAL_SECONDS=1
RECONNECT_MAXIMUM_SECONDS=30
CONNECT_TIMEOUT_MILLISECONDS=5000
REQUEST_TIMEOUT_MILLISECONDS=10000
