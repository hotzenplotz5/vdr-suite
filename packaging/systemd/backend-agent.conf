# Public Control-Plane HTTPS origin. No provider URL belongs here.
CONTROL_PLANE_URL=https://control-plane.example.invalid
BACKEND_ID=default
IDENTITY_PATH=/var/lib/vdr-suite/backend-agent/identity
ENROLLMENT_PATH=/var/lib/vdr-suite/backend-agent/enrollment
CA_CERTIFICATE_PATH=
SOFTWARE_VERSION=vdr-suite-backend-agent/1

# Read-only facts only. The packaged default publishes backend health only.
# To opt in to local Channel observations, add channels-conf to ADAPTERS and
# channels to OBSERVATION_DOMAINS together. No fallback source is selected.
ADAPTERS=
OBSERVATION_DOMAINS=backend-health
CHANNELS_CONF_PATH=/var/lib/vdr/channels.conf
COMMAND_STATE_PATH=/var/lib/vdr-suite/backend-agent/commands.state

# Configurable command types remain on the established native Timer allowlist.
# Recording marks mutation is activated by the backend-agent binary when this
# loopback SuiteBridge endpoint is configured and is advertised only after its
# dedicated live capability/provider fence has been discovered as enabled.
SUITEBRIDGE_HOST=127.0.0.1
SUITEBRIDGE_PORT=6419
# Optional private local control socket; both VDR and the Agent must agree.
# Allowed only below /run; permissions and the parent directory are package-owned.
# SUITEBRIDGE_CONTROL_SOCKET_PATH=/run/vdr/vdr-suite-control/control.sock
COMMAND_TYPES=vdr.timer.create,vdr.timer.update,vdr.timer.toggle,vdr.timer.delete

HEARTBEAT_INTERVAL_SECONDS=30
RECONNECT_INITIAL_SECONDS=1
RECONNECT_MAXIMUM_SECONDS=30
CONNECT_TIMEOUT_MILLISECONDS=5000
REQUEST_TIMEOUT_MILLISECONDS=10000

# MT.I3.2: Optional backend-local tool locations for other Linux VDR hosts.
# Defaults when omitted: /usr/bin/ffmpeg, /usr/bin/ffprobe, /usr/bin/vdr.
# Use real absolute paths from this host; never supply through the browser.
# MEDIA_FFMPEG_PATH=/usr/local/bin/ffmpeg
# MEDIA_FFPROBE_PATH=/usr/local/bin/ffprobe
# MEDIA_VDR_PATH=/usr/local/bin/vdr

# MT.ENC3.1: Optional backend-local encoder settings.
# Production defaults remain H.264 CRF 23 and H.265 CRF 27.
# Encoders always target fixed VDR MPEG-TS / 8-bit Main profiles.
# MEDIA_IMPORT_H264_CRF=23
# MEDIA_IMPORT_H264_PRESET=medium
# MEDIA_SHRINK_H265_CRF=27
# MEDIA_SHRINK_H265_PRESET=medium
# Configure VAAPI only for a real render device on this backend:
# MEDIA_VAAPI_RENDER_DEVICE=/dev/dri/renderD128
