# Private SuiteBridge Live-TV and HbbTV provider transport directories.
# systemd-tmpfiles creates missing parent directories below /run as root-owned 0755.
# Keep each socket root private to VDR; the local Suite media worker runs as root.
d /run/vdr/vdr-suite-live 0700 vdr vdr -
d /run/vdr/vdr-suite-hbbtv-media 0700 vdr vdr -
d /run/vdr/vdr-suite-control 0700 vdr vdr -
