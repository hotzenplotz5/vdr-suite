name: Add-on platform isolated checks

on:
  push:
    branches:
      - work/addon-platform-registry-lifecycle
    paths:
      - 'core/addons/**'
      - 'tools/addons/**'
      - 'mk/addons.mk'
      - '.github/workflows/addon-platform-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-platform-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run targeted installed registry and Core provider tests
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          make check-addon-registry
          make test-addon-handler-registry
          make test-addon-provider-admission
          make test-addon-provider-binding
          make test-addon-provider-read-service
          make test-addon-provider-approval
          echo "ADDON_ISOLATED_CI=PASS"
