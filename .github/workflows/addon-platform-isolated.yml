name: Add-on platform isolated checks

on:
  push:
    branches:
      - work/addon-platform-registry-lifecycle
    paths:
      - 'core/addons/**'
      - 'addons/media-tools/**'
      - 'core/security/include/AuthorizationService.h'
      - 'core/security/src/HumanAccountGrantAdministrationService.cpp'
      - 'core/security/tests/test_authorization_service.cpp'
      - 'core/security/tests/test_human_account_grant_administration_service.cpp'
      - 'tools/addons/**'
      - 'mk/addons.mk'
      - 'web/frontend/settings-account-admin.js'
      - 'web/frontend/api/account-admin-client-api.js'
      - 'web/frontend/tests/test_mu9e_grant_mutation_ui.js'
      - '.github/workflows/addon-platform-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-platform-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run targeted installed registry and Core provider tests
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export TMPDIR="$RUNNER_TEMP"
          test -d "$TMPDIR"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          make check-addon-registry
          make test-addon-handler-registry
          make test-addon-provider-admission
          make test-addon-permission-catalog
          make test-addon-provider-binding
          make test-addon-provider-read-service
          make test-addon-provider-approval
          make test-addon-agent-dispatch-gate
          make test-media-tools-agent-request
          make test-media-tools-canonical-agent-bridge
          # One implementation owner, never a shadow copy under modules.
          for name in include/MediaImport.h src/MediaImport.cpp src/main.cpp tests/test_media_import.cpp; do
            test -f "addons/media-tools/$name"
            test ! -e "modules/rectools/$name"
          done
          make test-addon-media-import
          make addon-media-import
          make test-addon-media-tools-package
          make test-addon-agent-advertisement
          make test-media-tools-agent-dispatch
          make test-addon-activation-intent
          make test-addon-administration-service
          make test-addon-activation-catalog
          make test-addon-access-policy
          make test-security-authorization
          make test-security-human-account-grant-administration
          echo "ADDON_ISOLATED_CI=PASS"

      - name: Build descriptor-pinned handler verifier
        run: make build-addon-pinned-handler-test

      - name: Run root-owned descriptor test in isolated CI fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo env TMPDIR=/root "$(pwd)/.build/addons/test_addon_pinned_handler"
          echo "PINNED_ADDON_HANDLER_CI=PASS"

      - name: Build canonical Core approval verifier
        run: make build-addon-root-approval-test

      - name: Verify Core approval and pinned handler agree
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo env TMPDIR=/root "$(pwd)/.build/addons/test_addon_root_approval"
          echo "CORE_ADDON_APPROVAL_CI=PASS"

      - name: Build unprivileged Agent filesystem acceptance
        run: make build-addon-nonroot-snapshot-test

      - name: Verify root-controlled approval as nonroot Agent identity
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo env TMPDIR=/root "$(pwd)/.build/addons/test_addon_nonroot_snapshot"
          echo "NONROOT_ADDON_SNAPSHOT_CI=PASS"

      - name: Verify add-on permissions in existing settings UI
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check web/frontend/settings-account-admin.js
          node web/frontend/tests/test_mu9e_grant_mutation_ui.js

      - name: Isolated root-owned approval and revocation acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d /root || sudo test -d /root
          sudo env TMPDIR=/root PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s tools/addons \
            -p 'test_admin_approval_root_acceptance.py'
