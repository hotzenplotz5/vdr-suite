name: Phase 69.D channel neighbor daemon syntax

on:
  push:
    branches:
      - work/public-v1-vidaa-unified-20261018

permissions:
  contents: read

jobs:
  daemon-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Install C++ headers for syntax-only build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libsqlite3-dev libcurl4-openssl-dev libssl-dev libcrypt-dev
      - name: Compile daemon initialization without linking or deploying
        run: |
          git rev-parse HEAD
          make -j1 test-phase69d-public-channel-neighbor-daemon-syntax
