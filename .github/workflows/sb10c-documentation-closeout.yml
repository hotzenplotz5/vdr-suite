name: SB.10c documentation closeout

on:
  pull_request:
    branches:
      - feature/vdr-plugin-suite-bridge-foundation
    paths:
      - .github/sb10c-documentation-closeout-trigger

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out bridge branch
        uses: actions/checkout@v4
        with:
          ref: feature/vdr-plugin-suite-bridge-foundation
          fetch-depth: 0

      - name: Update SB.10c acceptance documentation
        run: python3 tools/update_sb10c_acceptance_docs.py

      - name: Check documentation
        run: make test-docs

      - name: Check architecture
        run: make test-architecture

      - name: Check whitespace
        run: git diff --check

      - name: Commit documentation closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/suite-bridge-observation-lifecycle.md
          git add vdr-plugin-suite-bridge/docs/ROADMAP.md
          git add vdr-plugin-suite-bridge/docs/VDR-SUITE-HANDOFF.md
          git commit -m "Docs: record SB.10c automated and live acceptance"
          git push origin HEAD:feature/vdr-plugin-suite-bridge-foundation
