name: Bounded legacy branch cleanup (2026-10-18)

# Exactly one merge-triggered cleanup of an explicit, immutable allowlist.
# Existing active/staked branches and all Launchpad recipe source branches are excluded.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-branch-cleanup-20261018.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'hotzenplotz5/vdr-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Delete only explicitly approved, unchanged, unreferenced branch tips
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo="${GITHUB_REPOSITORY}"
          test "$repo" = hotzenplotz5/vdr-suite
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git branch --show-current)" = main
          open_prs="$(gh api "repos/$repo/pulls?state=open&per_page=100")"
          main_head="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
          echo "REPO=$repo MAIN_HEAD=$main_head"
          successes=0
          retained=0
          while read -r branch expected_sha pr_number expected_state; do
            test -n "$branch" || continue
            case "$branch" in main|master|work/launchpad-debian-quilt-*|work/packaging-debian-ubuntu-install)
              echo "STOP_PROTECTED_OR_RECIPE_BRANCH=$branch"; exit 1;;
            esac
            actual="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if test -z "$actual"; then
              echo "BRANCH_ALREADY_ABSENT=$branch"; continue
            fi
            if test "$actual" != "$expected_sha"; then
              echo "BRANCH_RETAINED_SHA_CHANGED=$branch actual=$actual expected=$expected_sha"
              retained=$((retained+1))
              continue
            fi
            pr_json="$(gh api "repos/$repo/pulls/$pr_number")"
            pr_branch="$(jq -r '.head.ref' <<<"$pr_json")"
            pr_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            pr_state="$(jq -r '.state' <<<"$pr_json")"
            pr_merged="$(jq -r '.merged_at // empty' <<<"$pr_json")"
            test "$pr_branch" = "$branch" && test "$pr_sha" = "$expected_sha" &&
              test "$pr_state" = closed || {
                echo "BRANCH_RETAINED_PR_NOT_MATCHED=$branch"; retained=$((retained+1)); continue;
              }
            case "$expected_state" in
              merged)
                if test -z "$pr_merged"; then
                  echo "BRANCH_RETAINED_PR_NOT_MERGED=$branch"; retained=$((retained+1)); continue
                fi
                ;;
              closed-unmerged)
                if test -n "$pr_merged"; then
                  echo "BRANCH_RETAINED_DUPLICATE_PR_WAS_MERGED=$branch"; retained=$((retained+1)); continue
                fi
                ;;
              *) echo "STOP_INVALID_EXPECTED_STATE=$expected_state"; exit 1;;
            esac
            if jq -e --arg name "$branch" 'any(.[]; .head.ref == $name or .base.ref == $name)' <<<"$open_prs" >/dev/null; then
              echo "BRANCH_RETAINED_OPEN_PR_DEPENDENCY=$branch"; retained=$((retained+1)); continue
            fi
            if git grep -q -F "$branch" -- .github/workflows ':!.github/workflows/one-time-branch-cleanup-20261018.yml'; then
              echo "BRANCH_RETAINED_WORKFLOW_REFERENCE=$branch"; retained=$((retained+1)); continue
            fi
            if gh api "repos/$repo/branches/$branch" --jq '.protected' | grep -Fxq true; then
              echo "BRANCH_RETAINED_PROTECTED=$branch"; retained=$((retained+1)); continue
            fi
            # Guard immediately before deletion against concurrent branch movement.
            tip="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            if test "$tip" != "$expected_sha"; then
              echo "BRANCH_RETAINED_RACED=$branch"; retained=$((retained+1)); continue
            fi
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
            echo "BRANCH_DELETED=$branch PR=$pr_number"
            successes=$((successes+1))
          done <<'EXACT_BRANCH_ALLOWLIST'
