name: Apply API Router Test Repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-api-router-test:
    if: github.head_ref == 'agent/architecture-audit-adrs'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply fixture repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/rest/tests/test_api_router.cpp')
          text = path.read_text(encoding='utf-8')

          include_old = (
              '#include "RecordingActionExecutionController.h"\n'
              '#include "RecordingActionValidationController.h"\n'
          )
          include_new = (
              '#include "RecordingActionExecutionController.h"\n'
              '#include "RecordingActionPreviewController.h"\n'
              '#include "RecordingActionValidationController.h"\n'
          )
          if '#include "RecordingActionPreviewController.h"' not in text:
              assert text.count(include_old) == 1
              text = text.replace(include_old, include_new, 1)

          fixture_old = (
              '    RecordingActionExecutionController recordingActionExecutionController(\n'
              '        recordingActionExecutionService,\n'
              '        recordingActionExecutionJsonSerializer,\n'
              '        recordingActionBackendExecutorAdapterRegistry,\n'
              '        recordingActionValidationRequestParser);\n'
              '\n'
              '    VdrTimerActionExecutionService vdrTimerActionExecutionService;\n'
          )
          fixture_new = (
              '    RecordingActionExecutionController recordingActionExecutionController(\n'
              '        recordingActionExecutionService,\n'
              '        recordingActionExecutionJsonSerializer,\n'
              '        recordingActionBackendExecutorAdapterRegistry,\n'
              '        recordingActionValidationRequestParser);\n'
              '\n'
              '    RecordingActionRequestPreviewService recordingActionPreviewService;\n'
              '    RecordingActionRequestPreviewResultJsonSerializer\n'
              '        recordingActionPreviewJsonSerializer;\n'
              '    RecordingActionPreviewController recordingActionPreviewController(\n'
              '        recordingActionPreviewService,\n'
              '        recordingActionPreviewJsonSerializer,\n'
              '        recordingActionValidationRequestParser);\n'
              '\n'
              '    VdrTimerActionExecutionService vdrTimerActionExecutionService;\n'
          )
          if 'RecordingActionRequestPreviewService recordingActionPreviewService;' not in text:
              assert text.count(fixture_old) == 1
              text = text.replace(fixture_old, fixture_new, 1)

          args_old = (
              '        recordingActionValidationController,\n'
              '        recordingActionExecutionController,\n'
              '        vdrTimerActionController,\n'
          )
          args_new = (
              '        recordingActionValidationController,\n'
              '        recordingActionExecutionController,\n'
              '        recordingActionPreviewController,\n'
              '        vdrTimerActionController,\n'
          )
          remaining = text.count(args_old)
          if remaining:
              assert remaining == 2
              text = text.replace(args_old, args_new)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit fixture repair
        run: |
          if git diff --quiet -- api/rest/tests/test_api_router.cpp; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/rest/tests/test_api_router.cpp
          git commit -m "Test: update ApiRouter fixtures for preview controller"
          git push origin HEAD:agent/architecture-audit-adrs
