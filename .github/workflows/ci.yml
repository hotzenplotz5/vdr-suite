name: Apply API Router Test Repair

on:
  push:

permissions:
  contents: write

jobs:
  repair-api-router-test:
    if: github.ref == 'refs/heads/agent/architecture-audit-adrs'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-audit-adrs
          fetch-depth: 0

      - name: Apply fixture repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/rest/tests/test_api_router.cpp')
          text = path.read_text(encoding='utf-8')

          if '#include "RecordingActionPreviewController.h"' not in text:
              old = '#include "RecordingActionExecutionController.h"\n#include "RecordingActionValidationController.h"\n'
              new = '#include "RecordingActionExecutionController.h"\n#include "RecordingActionPreviewController.h"\n#include "RecordingActionValidationController.h"\n'
              assert text.count(old) == 1
              text = text.replace(old, new, 1)

          fixture_marker = '    RecordingActionRequestPreviewService recordingActionPreviewService;\n'
          if fixture_marker not in text:
              old = '''    RecordingActionExecutionController recordingActionExecutionController(
              recordingActionExecutionService,
              recordingActionExecutionJsonSerializer,
              recordingActionBackendExecutorAdapterRegistry,
              recordingActionValidationRequestParser);

          VdrTimerActionExecutionService vdrTimerActionExecutionService;
          '''
              new = '''    RecordingActionExecutionController recordingActionExecutionController(
              recordingActionExecutionService,
              recordingActionExecutionJsonSerializer,
              recordingActionBackendExecutorAdapterRegistry,
              recordingActionValidationRequestParser);

          RecordingActionRequestPreviewService recordingActionPreviewService;
          RecordingActionRequestPreviewResultJsonSerializer
              recordingActionPreviewJsonSerializer;
          RecordingActionPreviewController recordingActionPreviewController(
              recordingActionPreviewService,
              recordingActionPreviewJsonSerializer,
              recordingActionValidationRequestParser);

          VdrTimerActionExecutionService vdrTimerActionExecutionService;
          '''
              assert text.count(old) == 1
              text = text.replace(old, new, 1)

          old = '''        recordingActionValidationController,
              recordingActionExecutionController,
              vdrTimerActionController,
          '''
          new = '''        recordingActionValidationController,
              recordingActionExecutionController,
              recordingActionPreviewController,
              vdrTimerActionController,
          '''
          remaining = text.count(old)
          if remaining:
              assert remaining == 2
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit fixture repair
        run: |
          if git diff --quiet -- api/rest/tests/test_api_router.cpp; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/rest/tests/test_api_router.cpp
          git commit -m "Test: update ApiRouter fixtures for preview controller"
          git push origin HEAD:agent/architecture-audit-adrs
