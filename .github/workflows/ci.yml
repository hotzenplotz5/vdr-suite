name: VDR-Suite CI

on:
  push:
  pull_request:

concurrency:
  group: vdr-suite-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -f README.md
          test -f docs/project-principles.md
          test -f docs/phase-0/01-vision.md
          test -f docs/phase-0/02-architecture.md
          test -f docs/phase-0/03-data-model.md
          test -f docs/phase-0/04-service-layer.md
          test -f docs/adr/ADR-0001-monorepo.md
          test -f docs/planning/roadmap.md
          test -f docs/planning/milestones.md

      - name: Run documentation checks
        run: |
          make test-docs
          make test-phase

  make-test-audit:
    runs-on: ubuntu-latest
    needs:
      - docs-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run strict Make and test inventory
        run: |
          python3 tools/audit_make_test_inventory.py --check | tee make-test-inventory.txt
          python3 tools/audit_make_test_inventory.py --json > make-test-inventory.json

      - name: Dry-run complete test graph
        run: make -n test-all >/dev/null

      - name: Upload Make test audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: make-test-audit-bundle
          path: |
            make-test-inventory.txt
            make-test-inventory.json
            Makefile
            mk/
          if-no-files-found: error
          retention-days: 14

  frontend-regression-test:
    runs-on: ubuntu-latest
    needs:
      - docs-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install frontend test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs

      - name: Run frontend contract tests
        run: make test-ci-frontend

  fast-regression-test:
    runs-on: ubuntu-latest
    needs:
      - docs-check
      - make-test-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev

      - name: Run fast CI regression test
        run: make test-ci-fast

      - name: Build daemon
        run: make daemon

  packaging-regression-test:
    runs-on: ubuntu-latest
    needs:
      - frontend-regression-test
      - fast-regression-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev

      - name: Run packaging and install staging tests
        run: make test-ci-packaging
