name: Repair Remaining API Router Test Fixtures

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-api-router-tests:
    if: github.head_ref == 'agent/architecture-audit-adrs'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply fixture repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'api/rest/tests/test_api_router_epg_cache_routes.cpp': 2,
              'api/rest/tests/test_api_router_searchtimer_preview_epg_cache_refresh_route.cpp': 1,
              'api/rest/tests/test_api_router_searchtimer_preview_refresh_then_preview.cpp': 1,
          }

          include_old = (
              '#include "RecordingActionExecutionController.h"\n'
              '#include "RecordingActionExecutionResultJsonSerializer.h"\n'
          )
          include_new = (
              '#include "RecordingActionExecutionController.h"\n'
              '#include "RecordingActionPreviewController.h"\n'
              '#include "RecordingActionExecutionResultJsonSerializer.h"\n'
          )

          fixture_old = (
              '    RecordingActionExecutionController recordingActionExecutionController(\n'
              '        recordingActionExecutionService,\n'
              '        recordingActionExecutionJsonSerializer,\n'
              '        recordingActionBackendExecutorAdapterRegistry,\n'
              '        recordingActionValidationRequestParser);\n'
              '\n'
              '    VdrTimerActionExecutionService vdrTimerActionExecutionService;\n'
          )
          fixture_new = (
              '    RecordingActionExecutionController recordingActionExecutionController(\n'
              '        recordingActionExecutionService,\n'
              '        recordingActionExecutionJsonSerializer,\n'
              '        recordingActionBackendExecutorAdapterRegistry,\n'
              '        recordingActionValidationRequestParser);\n'
              '\n'
              '    RecordingActionRequestPreviewService recordingActionPreviewService;\n'
              '    RecordingActionRequestPreviewResultJsonSerializer\n'
              '        recordingActionPreviewJsonSerializer;\n'
              '    RecordingActionPreviewController recordingActionPreviewController(\n'
              '        recordingActionPreviewService,\n'
              '        recordingActionPreviewJsonSerializer,\n'
              '        recordingActionValidationRequestParser);\n'
              '\n'
              '    VdrTimerActionExecutionService vdrTimerActionExecutionService;\n'
          )

          args_old = (
              '        recordingActionValidationController,\n'
              '        recordingActionExecutionController,\n'
              '        vdrTimerActionController,\n'
          )
          args_new = (
              '        recordingActionValidationController,\n'
              '        recordingActionExecutionController,\n'
              '        recordingActionPreviewController,\n'
              '        vdrTimerActionController,\n'
          )

          for filename, expected_args in files.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              if '#include "RecordingActionPreviewController.h"' not in text:
                  assert text.count(include_old) == 1, filename
                  text = text.replace(include_old, include_new, 1)

              if 'RecordingActionRequestPreviewService recordingActionPreviewService;' not in text:
                  assert text.count(fixture_old) == 1, filename
                  text = text.replace(fixture_old, fixture_new, 1)

              remaining = text.count(args_old)
              if remaining:
                  assert remaining == expected_args, (filename, remaining)
                  text = text.replace(args_old, args_new)

              path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit fixture repairs
        run: |
          if git diff --quiet -- api/rest/tests; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/rest/tests/test_api_router_epg_cache_routes.cpp \
            api/rest/tests/test_api_router_searchtimer_preview_epg_cache_refresh_route.cpp \
            api/rest/tests/test_api_router_searchtimer_preview_refresh_then_preview.cpp
          git commit -m "Test: update remaining ApiRouter preview fixtures"
          git push origin HEAD:agent/architecture-audit-adrs
