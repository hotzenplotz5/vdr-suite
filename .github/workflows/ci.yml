name: VDR-Suite CI

on:
  push:
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -f README.md
          test -f docs/project-principles.md
          test -f docs/phase-0/01-vision.md
          test -f docs/phase-0/02-architecture.md
          test -f docs/phase-0/03-data-model.md
          test -f docs/phase-0/04-service-layer.md
          test -f docs/adr/ADR-0001-monorepo.md
          test -f docs/planning/roadmap.md
          test -f docs/planning/milestones.md

      - name: Run documentation checks
        run: |
          make test-docs
          make test-phase

  fast-regression-test:
    runs-on: ubuntu-latest
    needs:
      - docs-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev

      - name: Run fast CI regression test
        run: make test-ci-fast

      - name: Capture Make test inventory
        if: always()
        run: |
          python3 tools/check_make_test_manifest.py | tee make-test-inventory.txt
          python3 tools/list_make_test_debt.py | tee -a make-test-inventory.txt

      - name: Upload Make test audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: make-test-audit-bundle
          path: |
            make-test-inventory.txt
            Makefile
            mk/
          if-no-files-found: error
          retention-days: 14

      - name: Build daemon
        run: make daemon

  frontend-contracts:
    runs-on: ubuntu-latest
    needs:
      - docs-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend runtime
        run: |
          python3 --version
          node --version

      - name: Run frontend contract tests
        run: make test-ci-frontend

  packaging-check:
    runs-on: ubuntu-latest
    needs:
      - docs-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev

      - name: Run packaging staging tests
        run: make test-ci-packaging
