name: VDR-Suite CI

on:
  push:
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -f README.md
          test -f docs/project-principles.md
          test -f docs/phase-0/01-vision.md
          test -f docs/phase-0/02-architecture.md
          test -f docs/phase-0/03-data-model.md
          test -f docs/phase-0/04-service-layer.md
          test -f docs/adr/ADR-0001-monorepo.md
          test -f docs/planning/roadmap.md
          test -f docs/planning/milestones.md

      - name: Run documentation checks
        run: |
          make test-docs
          make test-phase

  source-export:
    runs-on: ubuntu-latest
    needs:
      - docs-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload API router test source
        uses: actions/upload-artifact@v4
        with:
          name: api-router-test-source
          path: api/rest/tests/test_api_router.cpp
