          if text.count(line58) != 1:
              raise SystemExit(f'{rel}: expected one proposed ADR-0058 entry before acceptance')
          text = text.replace(line57, line57 + line58)
          text = replace_required(text, 'Next available canonical ADR after the current proposal:', 'Next available canonical ADR:', label=rel)
          text = replace_required(
              text,
              '## Proposed Canonical ADRs\n\n- [ADR-0058: Media Home, Responsive Browse and Preview Experience](ADR-0058-media-home-responsive-browse-preview.md)',
              '## Proposed Canonical ADRs\n\nNone.',
              label=rel,
