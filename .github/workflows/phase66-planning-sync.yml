name: Phase 66 Planning Sync

on:
  push:
    branches: [docs/phase66-media-home-planning]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Run Phase 66 planning sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase66-media-home-planning
          fetch-depth: 0

      - name: Accept ADR-0058 and reconcile current planning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          ROOT = Path('.').resolve()
          sys.path.insert(0, str((ROOT / 'tools').resolve()))

          from phase_status_contract import CURRENT, replace_current_status_values
          from update_phase_status import replace_block_status, replace_inline_status

          COMPLETED = 'Phase 65 - Streaming Gateway and Media Sessions'
          ACTIVE = 'none - Phase 66 has not started'
          NEXT = 'Phase 66 - Media Home and Browse Experience'

          def path(rel):
              return ROOT / rel

          def read(rel):
              return path(rel).read_text(encoding='utf-8')

          def write(rel, text):
              path(rel).write_text(text, encoding='utf-8')

          def replace_required(text, old, new, *, label, count=1):
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{label}: expected at least {count} occurrence(s), found {found}: {old!r}')
              return text.replace(old, new, count)

          def replace_all_required(text, old, new, *, label):
              found = text.count(old)
              if not found:
                  raise SystemExit(f'{label}: required text not found: {old!r}')
              return text.replace(old, new)

          def section_bounds(text, heading):
              marker = '## ' + heading
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing section heading: {heading}')
              end = text.find('\n## ', start + len(marker))
              if end < 0:
                  end = len(text)
              return start, end

          def replace_section(rel, heading, replacement):
              text = read(rel)
              start, end = section_bounds(text, heading)
              replacement = replacement.strip() + '\n\n'
              write(rel, text[:start] + replacement + text[end:].lstrip('\n'))

          def section(text, heading):
              start, end = section_bounds(text, heading)
              return text[start:end]

          def ensure_contains(rel, marker):
              if marker not in read(rel):
                  raise SystemExit(f'{rel}: missing required post-edit marker: {marker}')

          # ------------------------------------------------------------------
          # ADR-0058: proposal -> accepted architecture.
          # ------------------------------------------------------------------
          rel = 'docs/adr/ADR-0058-media-home-responsive-browse-preview.md'
          text = read(rel)
          text = replace_required(text, '**Proposed**', '**Accepted**', label=rel)
          text = replace_required(
              text,
              'This ADR proposes the product and architecture boundary for a Media Home / Browse experience after completed Phase 65. It does not by itself start Phase 66 runtime work. If accepted, the Strict Roadmap and Phase Map must be reconciled explicitly before implementation begins.',
              'This ADR defines the accepted product and architecture boundary for the Media Home / Browse experience after completed Phase 65. Acceptance establishes the Phase-66 planning boundary and future phase sequence; it does not start Phase 66 runtime work. Runtime still requires a separate explicit kickoff.',
              label=rel,
          )
          text = replace_required(text, '# Proposed numbered-phase reconciliation', '# Accepted numbered-phase reconciliation', label=rel)
          text = replace_required(text, 'If this ADR is accepted, the proposed sequence becomes:', 'The accepted future sequence is:', label=rel)
          text = replace_required(text, '# Proposed Phase-66 slices', '# Phase-66 slices', label=rel)
          text = replace_required(text, 'Proposed order:', 'Accepted implementation order:', label=rel)
          text = replace_required(text, '# Acceptance requirements for this ADR', '# Acceptance record for this ADR', label=rel)
          text = replace_required(
              text,
              'Before this ADR becomes **Accepted**:',
              'ADR-0058 is accepted because the following planning conditions are satisfied:',
              label=rel,
          )
          text = replace_required(
              text,
              'After acceptance, Phase 66 still requires a separate explicit runtime kickoff before implementation starts.',
              'Acceptance does not start runtime work. Phase 66 still requires a separate explicit runtime kickoff before implementation starts.',
              label=rel,
          )
          text = replace_required(
              text,
              '  -> proposes Media Home architecture and future sequencing reconciliation\n  -> does not start Phase 66 runtime',
              '  -> accepts Media Home architecture and future sequencing reconciliation\n  -> does not start Phase 66 runtime',
              label=rel,
          )
          write(rel, text)

          # Phase-66 implementation contract: accepted planning, runtime still off.
          rel = 'docs/development/phase-66-media-home-browse-experience.md'
          text = read(rel)
          text = replace_required(
              text,
              'Status: **Proposed implementation contract under ADR-0058. Runtime not started.**',
              'Status: **Accepted implementation contract under ADR-0058. Runtime not started.**',
              label=rel,
          )
          text = replace_required(text, '# Proposed future phase sequence', '# Accepted future phase sequence', label=rel)
          text = replace_required(
              text,
              'If ADR-0058 is accepted, the intended numbered sequence is:',
              'Under accepted ADR-0058, the numbered sequence is:',
              label=rel,
          )
          text = replace_required(
              text,
              'Merging this planning contract does not implicitly authorize Phase-66 runtime implementation unless the accompanying ADR/roadmap reconciliation explicitly marks ADR-0058 accepted and a separate Phase-66 kickoff is given.',
              'Merging this accepted planning contract does not implicitly authorize Phase-66 runtime implementation. ADR-0058 and the roadmap establish the architecture and phase order; a separate explicit Phase-66 runtime kickoff is still required.',
              label=rel,
          )
          write(rel, text)

          # ------------------------------------------------------------------
          # ADR index and ADR-0054 sequencing relationship.
          # ------------------------------------------------------------------
          rel = 'docs/adr/index.md'
          text = read(rel)
          line57 = '- [ADR-0057: Recording Network Interruption Recovery](ADR-0057-recording-network-interruption-recovery.md)\n'
