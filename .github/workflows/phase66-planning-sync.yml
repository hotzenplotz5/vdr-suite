Binding implementation contract: [Phase 66 Media Home and Browse Experience](../development/phase-66-media-home-browse-experience.md).

### Phase goal

Turn the completed Phase-65 media foundation and existing Channel/EPG/Recording/Metadata domains into one responsive first-party landing and browse experience without creating a second source of truth or playback lifecycle.

Core rule:

```text
Browse first, playback second.
```

Hero focus and rail navigation update immediately. Optional Live preview is deferred, cancelable and attached only through the existing Phase-65 MediaSession / canonical playback-owner lifecycle.

### Coherent implementation sequence

```text
66.1 Home Shell and Responsive Information Architecture
66.2 Live-TV Hero Carousel
66.3 Deferred Live Preview
66.4 Continue Watching
66.5 Recording Discovery Rails
66.6 Recently Watched / History
66.7 Visual Polish and Accessibility
66.8 Golden User Journey and Real-System Acceptance
```

### Hard invariants

- Home is a projection over existing Channel, ProgramEvent, Recording, Metadata, Genre and artwork truth.
- No Home-specific media identity, metadata database, MediaSession owner, restart path or cleanup engine is introduced.
- Browse focus, preview intent and explicit `Watch Live` are distinct states/actions.
- Rapid focus movement creates no preview session; stale preview startup cannot attach after focus moves.
