              '| G-25 | Stable public API version/error/compatibility contract | Planned/partial | Internal Suite client contracts exist; stable independent-client API hardening remains Phase 69. | ADR-0048 / Phase 69 |',
              '| G-34 | Client playback engine / media adaptation boundary | Strong foundation | ADR-0053 is implemented through browser Recording/Live playback, typed least-transformation selection, persistent playback ownership, completed-Recording seek/restart, normalized track selection, browser-local Volume/Mute, bounded continuous-fMP4 MSE forward buffering and sync-safe exact HLS resume. The remaining Phase-65.D architecture gap is semantic consolidation, not another player core. | ADR-0053, ADR-0055 / Phase 65.D |':
              '| G-34 | Client playback engine / media adaptation boundary | Closed foundation | Phase 65 completed browser Recording/Live playback, typed least-transformation selection, persistent playback ownership, completed-Recording seek/restart, normalized tracks, browser-local Volume/Mute, bounded fMP4 buffering and sync-safe exact HLS resume without introducing another player core. | ADR-0053, ADR-0055 / Phase 65.D |',
              '| G-38 | Teletext domain service | Planned | No canonical Teletext runtime exists yet. Accepted ADR-0054 models service/page/subpage data independently of OSD rendering. | ADR-0054 / Phase 66 |':
              '| G-38 | Teletext domain service | Planned | No canonical Teletext runtime exists yet. Accepted ADR-0054 models service/page/subpage data independently of OSD rendering. | ADR-0054 / Phase 67 |',
              '| G-39 | HbbTV broadcast application domain/runtime | Planned | No canonical HbbTV runtime exists yet. Accepted ADR-0054 models application discovery/session/runtime without public raw plugin/browser commands. | ADR-0054 / Phase 66 |':
              '| G-39 | HbbTV broadcast application domain/runtime | Planned | No canonical HbbTV runtime exists yet. Accepted ADR-0054 models application discovery/session/runtime without public raw plugin/browser commands. | ADR-0054 / Phase 67 |',
              '| G-41 | Recommendation/content graph | Deferred vision | Requires stable identities, privacy/preferences, provenance and Phase-68 public resource semantics plus a dedicated ADR. | future ADR / Phase 69 |':
              '| G-41 | Recommendation/content graph | Deferred vision | Requires stable identities, privacy/preferences, provenance and Phase-69 public resource semantics plus a dedicated ADR. | future ADR / Phase 70 |',
              '| G-42 | Normalized playback presentation/timeline/continuity/failure semantics | Planned on strong implementation foundation | ADR-0056 is accepted after real Phase-65.D transport/timeline/resume evidence. Remaining implementation is a provider-free `MediaPlaybackContract`, canonical owner lifecycle publication, explicit presentation generation/discontinuity and classified failures. Diagnostics follow semantic correctness and are not authority. | ADR-0056 / Phase 65.D |':
              '| G-42 | Normalized playback presentation/timeline/continuity/failure semantics | Closed foundation | ADR-0056 mandatory semantics are completed: provider-free `MediaPlaybackContract`, canonical owner lifecycle publication, explicit presentation generation/discontinuity and classified failures. Optional read-only diagnostics remain observational follow-up. | ADR-0056 / Phase 65.D |',
          }
          for old, new in replacements.items():
              text = replace_required(text, old, new, label=rel)
          anchor = '| G-42 | Normalized playback presentation/timeline/continuity/failure semantics | Closed foundation | ADR-0056 mandatory semantics are completed: provider-free `MediaPlaybackContract`, canonical owner lifecycle publication, explicit presentation generation/discontinuity and classified failures. Optional read-only diagnostics remain observational follow-up. | ADR-0056 / Phase 65.D |\n'
          home_row = '| G-43 | Responsive Media Home / browse-first preview composition | Planned; architecture accepted | ADR-0058 and the bounded Phase-66 contract define responsive Home composition, Live hero browsing, deferred preview, truthful Continue Watching, discovery rails and desktop/mobile Golden Journeys. Runtime has not started. | ADR-0058 / Phase 66 |\n'
          text = replace_required(text, anchor, anchor + home_row, label=rel)
          start, _ = section_bounds(text, 'Priority view')
          end, _ = section_bounds(text, 'Maintenance rules')
          priority = '''## Priority view

### Next numbered runtime product domain — Phase 66

Media Home / Browse architecture is accepted via ADR-0058; runtime remains not started and requires a separate explicit kickoff.

The first implementation boundary is Slice 66.1 Home Shell and Responsive Information Architecture. Later Phase-66 slices add Live hero browsing, deferred canonical preview, truthful Continue Watching, Recording discovery rails, explicit history semantics where needed, polish/accessibility and real desktop/mobile acceptance.

Phase 66 must preserve:

- completed Phase-65 MediaSession / playback-owner ownership;
- existing Channel/ProgramEvent/Recording/Metadata/Genre/artwork truth;
- browse focus independent of preview/playback state;
- stale-preview cancellation and deterministic relinquish;
- responsive recomposition rather than desktop shrinking;
- no fabricated cross-client resume/history authority.

### Following television product domain — Phase 67

Teletext/HbbTV architecture remains accepted via ADR-0054. Runtime follows Phase 66 and remains not started.

The binding rule is domain-first: Teletext pages instead of OSD-frame ownership, broadcast application sessions instead of raw URL/JS/key plugin control, and Phase-65 MediaSession boundaries for Suite-managed media.

### Later compatibility/platform work

Legacy OSD (Phase 68), stable public API hardening (Phase 69), storage federation and Recommendation/Content Graph (Phase 70) remain separate domains with their own prerequisites.

### Cross-cutting product work

Account/backend access administration, broad Timer UI, audit/operations surfaces and client-family rollout may progress when their prerequisites are met without silently advancing the numbered runtime phase.'''
          text = text[:start] + priority + '\n\n' + text[end:]
          if '[ADR-0058 Media Home Architecture]' not in text:
