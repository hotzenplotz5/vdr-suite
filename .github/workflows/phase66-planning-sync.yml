name: Phase 66 Planning Sync

on:
  push:
    branches:
      - docs/phase66-media-home-planning

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.head_commit.message == 'Run Phase 66 planning sync' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase66-media-home-planning
          fetch-depth: 0

      - name: Patch proven one-shot helper mismatches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/phase66_planning_sync_once.py")
          text = path.read_text(encoding="utf-8")

          old = 'start, end = section_bounds(text, "Sequencing Decision")'
          new = 'start = text.find("# Sequencing Decision")\nend = text.find("\\n# Implementation Direction", start)\nif start < 0 or end < 0:\n    raise SystemExit("ADR-0054: missing H1 sequencing boundary")'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one ADR-0054 section-boundary call")
          text = text.replace(old, new, 1)

          old = 'for rel in ["docs/planning/roadmap.md", "docs/planning/phase-map.md"]:\n    replace_block_status(p(rel), COMPLETED, ACTIVE, NEXT)\n'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one incompatible roadmap/phase-map block-status loop")
          text = text.replace(old, '', 1)

          old = 'for rel in ["docs/NEW-CHAT-HANDOFF.md", "docs/development/current-status.md"]:\n    replace_inline_status(p(rel), COMPLETED, ACTIVE, NEXT)\n'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one incompatible handoff/current-status inline loop")
          text = text.replace(old, '', 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Reconcile accepted Phase 66 planning
        run: python3 tools/phase66_planning_sync_once.py

      - name: Preserve required completed-phase history markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          handoff = Path("docs/NEW-CHAT-HANDOFF.md")
          text = handoff.read_text(encoding="utf-8")
          old = "[Current Project Status](development/current-status.md), [Current Architecture State](development/current-architecture-state.md), [Completed Phases](development/completed-phases.md), [Phase 64 Closeout](development/phase-64-closeout.md) and older Phase-65 development records provide stable historical context."
          new = "[Current Project Status](development/current-status.md), [Current Architecture State](development/current-architecture-state.md), [Completed Phases](development/completed-phases.md), [Phase 62 Closeout](development/phase-62-closeout.md), [Phase 64 Closeout](development/phase-64-closeout.md) and older Phase-65 development records provide stable historical context."
          if text.count(old) != 1:
              raise SystemExit("handoff historical closeout anchor mismatch")
          handoff.write_text(text.replace(old, new, 1), encoding="utf-8")

          current = Path("docs/development/current-status.md")
          text = current.read_text(encoding="utf-8")
          old = "Historical completed context includes Phases 58, 61, 62, 63 and 64."
          new = "Historical completed context includes Phase 58 - Frontend and Live Parity, Phase 61 - Suite Metadata and Genre Platform, Phase 62 - Identity, RBAC and Accountability Foundation, Phase 63 - Backend Agent and Secure Multi-Site Runtime, and Phase 64 - Timer Intent and Multi-Backend Orchestration."
          if text.count(old) != 1:
              raise SystemExit("current-status Phase 62 historical anchor mismatch")
          current.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate reconciled documentation
        run: |
          git diff --check
          python3 tools/check_phase_consistency.py
          python3 tools/check_completed_phase_markers.py
          python3 tools/check_phase_map_coverage.py
          python3 tools/check_doc_entrypoints.py
          python3 tools/check_docs.py
          python3 tools/check_doc_indexes.py
          python3 tools/check_doc_reachability.py

      - name: Commit reconciled planning
        run: |
          git config user.name hotzenplotz5
          git config user.email hotzenplotz5@gmx.de
          git add -A
          git commit -m "Docs: accept ADR-0058 and reconcile Phase 66"
          git push origin HEAD:docs/phase66-media-home-planning
