This supersedes only ADR-0054's former phase-number sequencing statement. It does **not** supersede the Broadcast Companion architecture in this ADR, nor the architecture decisions of ADR-0047 or ADR-0048.

Completed history through Phase 65 is unchanged. Phase 66 Media Home is the next strict runtime phase and remains not started until a separate explicit kickoff. Broadcast Companion runtime follows as Phase 67.'''
          text = text[:start] + replacement + '\n\n' + text[end:].lstrip('\n')
          text = replace_required(
              text,
              'After Phase 65 closes and Phase 66 is explicitly authorized, Phase 66 should use coherent verticals rather than micro-slices.',
