name: Phase 66 Planning Sync

on:
  push:
    branches:
      - docs/phase66-media-home-planning

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.head_commit.message == 'Run Phase 66 planning sync' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase66-media-home-planning
          fetch-depth: 0

      - name: Reconcile accepted Phase 66 planning
        run: python3 tools/phase66_planning_sync_once.py

      - name: Validate reconciled documentation
        run: |
          git diff --check
          python3 tools/check_phase_consistency.py
          python3 tools/check_completed_phase_markers.py
          python3 tools/check_phase_map_coverage.py
          python3 tools/check_doc_entrypoints.py
          python3 tools/check_docs.py
          python3 tools/check_doc_indexes.py
          python3 tools/check_doc_reachability.py

      - name: Commit reconciled planning
        run: |
          git config user.name hotzenplotz5
          git config user.email hotzenplotz5@gmx.de
          git add -A
          git commit -m "Docs: accept ADR-0058 and reconcile Phase 66"
          git push origin HEAD:docs/phase66-media-home-planning
