          start, end = section_bounds(text, 'Future-phase sequencing note')
          replacement = '''## Future-phase sequencing note

The Strict Roadmap owns phase numbering/order. Accepted ADR-0058 now establishes the not-yet-started post-Phase-65 sequence:

```text
65 Streaming [completed]
66 Media Home and Browse Experience
67 Broadcast Companion: Teletext + HbbTV
68 Legacy OSD
69 Public API Hardening
70 Recommendation / Knowledge Graph
```

ADR-0054, ADR-0047 and ADR-0048 retain their architecture decisions. ADR-0058 supersedes only their older not-yet-started future phase-number statements. Phase 66 Media Home remains runtime-not-started until a separate explicit kickoff.'''
          text = text[:start] + replacement + '\n\n' + text[end:].lstrip('\n')
          text = text.replace('[Proposed Phase 66 Media Home contract]', '[Phase 66 Media Home contract]')
          write(rel, text)

          rel = 'docs/adr/ADR-0054-broadcast-companion-teletext-hbbtv.md'
          text = read(rel)
          text = replace_required(
