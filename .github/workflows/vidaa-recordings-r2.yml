name: VIDAA Recording R2 (branch validation)
on:
  push:
    branches:
      - work/vidaa-recordings-r2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recording-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ and SQLite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libsqlite3-dev
      - name: Compile and test only new Recording domain units
        run: |
          make test-vdr-public-recording-identity
          make test-vdr-public-recording-collection
