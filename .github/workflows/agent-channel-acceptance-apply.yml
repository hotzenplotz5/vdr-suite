name: Apply Phase 63 Channel acceptance

on:
  push:
    branches:
      - agent/phase63-channel-observation-runtime

permissions:
  contents: write

jobs:
  apply-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified acceptance patch
        shell: bash
        run: |
          echo "bb7e4875f71a44a700cd5c8ec399d3769123362f2a3f142178e139bac4843dcc  .github/phase63-channel-acceptance.patch.gz.b64" | sha256sum --check --strict
          base64 -d .github/phase63-channel-acceptance.patch.gz.b64 | gzip -d > /tmp/phase63-channel-acceptance.patch
          echo "921d8df0010cff8f7279ad649c7392aa0317a5610cfa634f5ffcb56d7be63094  /tmp/phase63-channel-acceptance.patch" | sha256sum --check --strict
          git apply --index /tmp/phase63-channel-acceptance.patch
          git rm .github/phase63-channel-acceptance.patch.gz.b64
          git rm .github/workflows/agent-channel-acceptance-apply.yml
          git diff --cached --check
      - name: Commit guarded acceptance harness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add guarded Channel runtime acceptance"
          git push origin HEAD:agent/phase63-channel-observation-runtime
