name: Phase 63 command runtime bootstrap

on:
  push:
    branches:
      - agent/phase63-command-delivery-runtime

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and run bounded generator
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source = subprocess.check_output([
              "git", "show",
              "32678f0c8d199210a4ba4daa558562d1816e65c6:.github/workflows/phase63-command-runtime-bootstrap.yml",
          ], text=True)
          lines = source.splitlines()
          start = next(
              index + 1 for index, line in enumerate(lines)
              if line.strip() == "python3 - <<'PY'"
          )
          end = next(
              index for index in range(start, len(lines))
              if lines[index].strip() == "PY"
          )
          script_lines = [
              line[10:] if line.startswith("          ") else line
              for line in lines[start:end]
          ]
          Path("/tmp/phase63-command-runtime-generator.py").write_text(
              "\n".join(script_lines) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m py_compile /tmp/phase63-command-runtime-generator.py
          python3 /tmp/phase63-command-runtime-generator.py
      - name: Commit bounded runtime
        shell: bash
        run: |
          git config user.name hotzenplotz5
          git config user.email hotzenplotz5@gmx.de
          git add -A
          git commit -m "Add durable Agent command delivery runtime"
          git push origin HEAD:agent/phase63-command-delivery-runtime
