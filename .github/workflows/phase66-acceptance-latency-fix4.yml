name: Phase66 visible-series latency repair

on:
  push:
    branches:
      - work/phase66-home-performance-pagination

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: validate visible series before metadata backlog' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase66-home-performance-pagination
          fetch-depth: 0

      - name: Reapply verified representative scheduler
        shell: bash
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase66-acceptance-latency-fix3.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'phase66-fix3-patch', 'exec'))
          BOOT

      - name: Align production regression with background metadata convergence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/frontend/tests/test_phase66_recording_discovery.js')
          text = path.read_text()

          marker = """function buildLargeCanonicalSeriesSet() {\n"""
          helper = """async function waitForMetadataCoverage(calls, expectedCount) {\n  for (let attempt = 0; attempt < 100 && calls.metadata.length < expectedCount; attempt += 1) {\n    await new Promise((resolve) => setImmediate(resolve));\n  }\n  assert.strictEqual(calls.metadata.length, expectedCount);\n}\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('buildLargeCanonicalSeriesSet marker mismatch')
          text = text.replace(marker, helper + marker, 1)

          old = """  assert.strictEqual(production.calls.metadata.length, canonicalSeriesItems.length);\n  assert(production.metadataMaxInFlight() <= 4);\n  assert(production.metadataMaxInFlight() >= 2);\n  assert(production.calls.metadata.every((call) => call.route === '/api/vdr/recordings/metadata'));\n  assert(production.calls.metadata.every((call) => call.request.cache === 'no-store'));\n  assert(production.calls.metadata.every((call) => call.request.credentials === 'same-origin'));\n  assert(production.calls.metadata.every((call) => call.request.query.backend === 'default'));\n  assert.strictEqual(new Set(\n    production.calls.metadata.map((call) => call.request.query.backendNativeId)\n  ).size, canonicalSeriesItems.length);\n\n  const seriesRail = findRail(production.host, 'series');\n"""
          new = """  const metadataAtVisibleReady = production.calls.metadata.slice();\n  assert(metadataAtVisibleReady.length >= 14);\n  assert(\n    metadataAtVisibleReady.length < canonicalSeriesItems.length,\n    'visible Series completion must not wait for every episode metadata lookup'\n  );\n  assert(production.metadataMaxInFlight() <= 4);\n  assert(production.metadataMaxInFlight() >= 2);\n  assert(metadataAtVisibleReady.every((call) => call.route === '/api/vdr/recordings/metadata'));\n  assert(metadataAtVisibleReady.every((call) => call.request.cache === 'no-store'));\n  assert(metadataAtVisibleReady.every((call) => call.request.credentials === 'same-origin'));\n  assert(metadataAtVisibleReady.every((call) => call.request.query.backend === 'default'));\n  assert.strictEqual(new Set(\n    metadataAtVisibleReady.map((call) => call.request.query.backendNativeId)\n  ).size, metadataAtVisibleReady.length);\n\n  const seriesRail = findRail(production.host, 'series');\n"""
          if text.count(old) != 1:
              raise SystemExit('metadata pre-visible assertion block mismatch')
          text = text.replace(old, new, 1)

          old2 = """  assert.strictEqual(findRecordingCard(seriesRail, canonicalSeriesItems[0].recordingId), null);\n  assert.strictEqual(findRecordingCard(seriesRail, heuristicOnly.recordingId), null);\n\n  twdCard.listeners.click[0]();\n"""
          new2 = """  assert.strictEqual(findRecordingCard(seriesRail, canonicalSeriesItems[0].recordingId), null);\n  assert.strictEqual(findRecordingCard(seriesRail, heuristicOnly.recordingId), null);\n\n  await waitForMetadataCoverage(production.calls, canonicalSeriesItems.length);\n  assert(production.metadataMaxInFlight() <= 4);\n  assert(production.calls.metadata.every((call) => call.route === '/api/vdr/recordings/metadata'));\n  assert(production.calls.metadata.every((call) => call.request.cache === 'no-store'));\n  assert(production.calls.metadata.every((call) => call.request.credentials === 'same-origin'));\n  assert(production.calls.metadata.every((call) => call.request.query.backend === 'default'));\n  assert.strictEqual(new Set(\n    production.calls.metadata.map((call) => call.request.query.backendNativeId)\n  ).size, canonicalSeriesItems.length);\n\n  twdCard.listeners.click[0]();\n"""
          if text.count(old2) != 1:
              raise SystemExit('visible rail assertion insertion mismatch')
          path.write_text(text.replace(old2, new2, 1))
          PY

      - name: Run focused frontend regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check web/frontend/home-live-hero.js
          node --check web/frontend/home-recording-discovery.js
          node web/frontend/tests/test_phase66_live_tv_hero.js
          node web/frontend/tests/test_phase66_home_native_metadata_rails.js
          node web/frontend/tests/test_phase66_recording_discovery.js
          node web/frontend/tests/test_phase66_recording_discovery_progressive.js
          node web/frontend/tests/test_phase66_recording_discovery_contract.js
          git diff --check

      - name: Commit verified acceptance latency fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hotzenplotz5
          git config user.email hotzenplotz5@gmx.de
          git add web/frontend/home-live-hero.js \
                  web/frontend/home-recording-discovery.js \
                  web/frontend/tests/test_phase66_live_tv_hero.js \
                  web/frontend/tests/test_phase66_home_native_metadata_rails.js \
                  web/frontend/tests/test_phase66_recording_discovery.js
          git commit -m 'fix: remove Home EPG flash and prioritize series representatives'
          git push origin HEAD:work/phase66-home-performance-pagination
