name: Phase 63 command runtime finalize

on:
  push:
    branches:
      - agent/phase63-command-delivery-runtime
    paths:
      - .github/workflows/phase63-command-runtime-finalize.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase63-command-delivery-runtime
          fetch-depth: 0
      - name: Apply replay evidence and restart fencing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              candidate = Path(path)
              text = candidate.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              candidate.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "core/agent/include/BackendAgentCommand.h",
              "    std::uint64_t claimEpoch = 0;\n    std::int64_t deadline = 0;\n};\n",
              "    std::uint64_t claimEpoch = 0;\n    std::uint64_t deliveryCount = 0;\n    std::uint64_t receiptReplayCount = 0;\n    std::uint64_t resultReplayCount = 0;\n    std::int64_t deadline = 0;\n};\n",
          )

          delivery_path = Path("core/agent/src/BackendAgentCommandDelivery.cpp")
          delivery = delivery_path.read_text(encoding="utf-8")
          pairs = [
              (
                  '"replay_requested INTEGER NOT NULL DEFAULT 0,last_delivered_at INTEGER NOT NULL DEFAULT 0,updated_at INTEGER NOT NULL,"',
                  '"replay_requested INTEGER NOT NULL DEFAULT 0,last_delivered_at INTEGER NOT NULL DEFAULT 0,delivery_count INTEGER NOT NULL DEFAULT 0,receipt_replay_count INTEGER NOT NULL DEFAULT 0,result_replay_count INTEGER NOT NULL DEFAULT 0,updated_at INTEGER NOT NULL,"',
              ),
              (
                  'const char* sql="UPDATE backend_agent_commands SET replay_requested=0,last_delivered_at=?,updated_at=? WHERE command_id=?;";',
                  'const char* sql="UPDATE backend_agent_commands SET replay_requested=0,last_delivered_at=?,delivery_count=delivery_count+1,updated_at=? WHERE command_id=?;";',
              ),
              (
                  'result.accepted=text(existing,0)==identity; result.replayed=result.accepted; result.reasonCode=result.accepted?"command_receipt_replayed":"command_receipt_conflict"; sqlite3_finalize(existing); return result;',
                  'result.accepted=text(existing,0)==identity; result.replayed=result.accepted; result.reasonCode=result.accepted?"command_receipt_replayed":"command_receipt_conflict"; sqlite3_finalize(existing); if(result.accepted){sqlite3_stmt* replay=nullptr;const char* replaySql="UPDATE backend_agent_commands SET receipt_replay_count=receipt_replay_count+1 WHERE command_id=?;";if(sqlite3_prepare_v2(database_.handle(),replaySql,-1,&replay,nullptr)!=SQLITE_OK||!bindText(replay,1,r.commandId)||!done(replay)){result.accepted=false;result.replayed=false;result.reasonCode="command_database_unavailable";}} return result;',
              ),
              (
                  'if(sqlite3_step(existing)==SQLITE_ROW){result.accepted=text(existing,0)==identity;result.replayed=result.accepted;result.reasonCode=result.accepted?"command_result_replayed":"command_result_conflict";sqlite3_finalize(existing);return result;} sqlite3_finalize(existing);',
                  'if(sqlite3_step(existing)==SQLITE_ROW){result.accepted=text(existing,0)==identity;result.replayed=result.accepted;result.reasonCode=result.accepted?"command_result_replayed":"command_result_conflict";sqlite3_finalize(existing);if(result.accepted){sqlite3_stmt* replay=nullptr;const char* replaySql="UPDATE backend_agent_commands SET result_replay_count=result_replay_count+1 WHERE command_id=?;";if(sqlite3_prepare_v2(database_.handle(),replaySql,-1,&replay,nullptr)!=SQLITE_OK||!bindText(replay,1,r.commandId)||!done(replay)){result.accepted=false;result.replayed=false;result.reasonCode="command_database_unavailable";}}return result;} sqlite3_finalize(existing);',
              ),
              (
                  "c.backend_generation,c.claim_epoch,c.deadline FROM backend_agent_commands c",
                  "c.backend_generation,c.claim_epoch,c.delivery_count,c.receipt_replay_count,c.result_replay_count,c.deadline FROM backend_agent_commands c",
              ),
              (
                  "summary.backendGeneration=static_cast<std::uint64_t>(sqlite3_column_int64(s,7));summary.claimEpoch=static_cast<std::uint64_t>(sqlite3_column_int64(s,8));summary.deadline=sqlite3_column_int64(s,9);",
                  "summary.backendGeneration=static_cast<std::uint64_t>(sqlite3_column_int64(s,7));summary.claimEpoch=static_cast<std::uint64_t>(sqlite3_column_int64(s,8));summary.deliveryCount=static_cast<std::uint64_t>(sqlite3_column_int64(s,9));summary.receiptReplayCount=static_cast<std::uint64_t>(sqlite3_column_int64(s,10));summary.resultReplayCount=static_cast<std::uint64_t>(sqlite3_column_int64(s,11));summary.deadline=sqlite3_column_int64(s,12);",
              ),
          ]
          for old, new in pairs:
              count = delivery.count(old)
              if count != 1:
                  raise SystemExit(f"command delivery marker mismatch ({count}): {old[:100]!r}")
              delivery = delivery.replace(old, new, 1)
          delivery_path.write_text(delivery, encoding="utf-8")

          replace_once(
              "apps/tools/backend_agent_command_admin.cpp",
              '<<",\\\"claimEpoch\\\":"<<s.claimEpoch<<",\\\"deadline\\\":"<<s.deadline',
              '<<",\\\"claimEpoch\\\":"<<s.claimEpoch<<",\\\"deliveryCount\\\":"<<s.deliveryCount<<",\\\"receiptReplayCount\\\":"<<s.receiptReplayCount<<",\\\"resultReplayCount\\\":"<<s.resultReplayCount<<",\\\"deadline\\\":"<<s.deadline',
          )

          replace_once(
              "core/agent/tests/test_backend_agent_command_delivery.cpp",
              'auto summary=service.summaryForBackend("default");assert(summary.present&&summary.state=="completed"&&summary.resultCategory=="succeeded");',
              'auto summary=service.summaryForBackend("default");assert(summary.present&&summary.state=="completed"&&summary.resultCategory=="succeeded"&&summary.deliveryCount==2&&summary.receiptReplayCount==1&&summary.resultReplayCount==1);',
          )
          replace_once(
              "core/agent/tests/test_backend_agent_command_delivery.cpp",
              'auto replayPoll=service.poll(context(ActorType::Agent,"actor_agent"),poll,108);assert(replayPoll.assignment.present&&replayPoll.assignment.commandId==assignment->commandId);',
              'auto replayPoll=service.poll(context(ActorType::Agent,"actor_agent"),poll,108);assert(replayPoll.assignment.present&&replayPoll.assignment.commandId==assignment->commandId);summary=service.summaryForBackend("default");assert(summary.deliveryCount==3);',
          )

          client_path = Path("core/agent/src/BackendAgentCommandClient.cpp")
          client = client_path.read_text(encoding="utf-8")
          sync_marker = 'bool readStateFile(const std::string& path,std::map<std::string,std::string>& values,std::string& reason)\n'
          retire_helper = '''bool retireProtectedState(const std::string& path,std::string& reason)
          {
              if(path.empty()||path.front()!='/'){reason="invalid_command_state_path";return false;}
              struct stat status{};
              if(lstat(path.c_str(),&status)!=0){reason=errno==ENOENT?"command_state_not_found":"command_state_stat_failed";return errno==ENOENT;}
              if(!S_ISREG(status.st_mode)||(status.st_mode&(S_IRWXG|S_IRWXO))!=0){reason="command_state_unprotected";return false;}
              if(unlink(path.c_str())!=0||!syncParent(path)){reason="command_state_retire_failed";return false;}
              reason="completed_command_state_retired";
              return true;
          }
          '''
          if client.count(sync_marker) != 1:
              raise SystemExit("command client helper insertion marker mismatch")
          client = client.replace(sync_marker, retire_helper + sync_marker, 1)
          old_fence = '    if(!sameContext(state.assignment,context)){reason="local_command_generation_fenced";return false;}\n'
          new_fence = '''    if(!sameContext(state.assignment,context))
              {
                  if(state.resultPresent&&state.receiptAcknowledged&&state.resultAcknowledged)
                      return retireProtectedState(config.statePath,reason);
                  reason="local_command_generation_fenced";
                  return false;
              }
          '''
          if client.count(old_fence) != 1:
              raise SystemExit("command client generation fence marker mismatch")
          client = client.replace(old_fence, new_fence, 1)
          client_path.write_text(client, encoding="utf-8")

          Path("core/agent/tests/test_backend_agent_command_client.cpp").write_text(r'''#include "BackendAgentClient.h"
          #include "BackendAgentCommand.h"
          #include "BackendAgentCommandClient.h"

          #include <cassert>
          #include <cstdio>
          #include <fstream>
          #include <string>
          #include <sys/stat.h>
          #include <unistd.h>

          namespace
          {
          class NoTransport final : public IBackendAgentControlPlaneTransport
          {
          public:
              int calls = 0;
              BackendAgentTransportResponse postEnrollment(const std::string&,const std::string&,const std::string&,const std::string&) override
              {
                  ++calls; return {};
              }
              BackendAgentTransportResponse postAuthenticated(const std::string&,const std::string&,const std::string&,const std::string&) override
              {
                  ++calls; return {};
              }
          };

          BackendAgentCommandAssignment assignment()
          {
              BackendAgentCommandAssignment value;
              value.present=true;value.requestId="req_restart";value.correlationId="corr_restart";
              value.operationId="op_restart";value.jobId="job_restart";value.attemptId="att_restart";
              value.claimEpoch=1;value.commandId="cmd_restart";value.backendId="default";
              value.agentId="agt_client";value.agentInstanceId="agi_old";value.backendGeneration=7;
              value.commandType="probe.noop";value.payloadVersion=1;value.payload="{}";
              value.verificationPolicy="none";value.assignedAt=100;value.deadline=500;
              value.requestFingerprint=backendAgentCommandFingerprint(value);
              assert(backendAgentCommandValidAssignment(value));
              return value;
          }

          void writeState(const std::string& path,bool resultAcknowledged)
          {
              const auto value=assignment();
              std::ofstream out(path);
              out<<"version=1\nprotocol_version="<<value.protocolVersion
                 <<"\nrequest_id="<<value.requestId<<"\ncorrelation_id="<<value.correlationId
                 <<"\noperation_id="<<value.operationId<<"\njob_id="<<value.jobId
                 <<"\nattempt_id="<<value.attemptId<<"\nclaim_epoch="<<value.claimEpoch
                 <<"\ncommand_id="<<value.commandId<<"\nbackend_id="<<value.backendId
                 <<"\nagent_id="<<value.agentId<<"\nagent_instance_id="<<value.agentInstanceId
                 <<"\nbackend_generation="<<value.backendGeneration<<"\ncommand_type="<<value.commandType
                 <<"\npayload_version="<<value.payloadVersion<<"\npayload="<<value.payload
                 <<"\nrequest_fingerprint="<<value.requestFingerprint
                 <<"\nverification_policy="<<value.verificationPolicy
                 <<"\nassigned_at="<<value.assignedAt<<"\ndeadline="<<value.deadline
                 <<"\nreceipt_category=accepted\nreceived_at=110\nreceipt_reason=durably_recorded"
                 <<"\nreceipt_acknowledged=1\ndispatch_state=effect_reported\nresult_present=1"
                 <<"\nresult_acknowledged="<<(resultAcknowledged?1:0)
                 <<"\nverification_state=not_required\nresult_category=succeeded"
                 <<"\nerror_category=none\nretry_classification=none"
                 <<"\nbounded_diagnostics=probe.noop completed without native side effect"
                 <<"\ncompleted_at=120\n";
              out.close();
              assert(chmod(path.c_str(),0600)==0);
          }
          }

          int main()
          {
              const std::string path="/tmp/vdr-suite-command-restart-state";
              std::remove(path.c_str());
              BackendAgentCommandClientConfig config{path,{"probe.noop"}};
              BackendAgentCommandClientContext current{"agt_client","secret-material-at-least-thirty-two-bytes","default","agi_new",8};
              NoTransport transport;
              std::string reason;

              writeState(path,true);
              assert(reconcileBackendAgentCommandState(config,current,transport,reason));
              assert(reason=="completed_command_state_retired");
              assert(access(path.c_str(),F_OK)!=0);
              assert(transport.calls==0);

              writeState(path,false);
              assert(!reconcileBackendAgentCommandState(config,current,transport,reason));
              assert(reason=="local_command_generation_fenced");
              assert(access(path.c_str(),F_OK)==0);
              assert(transport.calls==0);
              std::remove(path.c_str());
              return 0;
          }
          ''', encoding="utf-8")

          replace_once(
              "mk/agent-tests.mk",
              ".PHONY: test-phase63-command-delivery-runtime\n\ntest-phase63-command-delivery-runtime:\n\tpython3 tools/check_phase63_command_delivery_runtime.py\n",
              ".PHONY: test-phase63-command-delivery-runtime\n\ntest-phase63-command-delivery-runtime:\n\tpython3 tools/check_phase63_command_delivery_runtime.py\n\t$(BUILD_CXX) $(CXXFLAGS) \\\n\t\t$(AGENT_COMMAND_DOMAIN_SRC) \\\n\t\t$(AGENT_COMMAND_JSON_SRC) \\\n\t\t$(AGENT_COMMAND_CLIENT_SRC) \\\n\t\tcore/agent/tests/test_backend_agent_command_client.cpp \\\n\t\t-o $(BUILD_DIR)/test_backend_agent_command_client\n\t$(BUILD_DIR)/test_backend_agent_command_client\n",
          )

          guard = Path("tools/check_phase63_command_delivery_runtime.py")
          text = guard.read_text(encoding="utf-8")
          text = text.replace(
              '"DELETE FROM backend_agent_command_capabilities WHERE backend_id=?",\n',
              '"DELETE FROM backend_agent_command_capabilities WHERE backend_id=?",\n                  "delivery_count=delivery_count+1",\n                  "receipt_replay_count=receipt_replay_count+1",\n                  "result_replay_count=result_replay_count+1",\n',
              1,
          )
          text = text.replace(
              '"capabilityPoll.accepted",\n',
              '"capabilityPoll.accepted",\n                  "receiptReplayCount==1",\n                  "resultReplayCount==1",\n',
              1,
          )
          text = text.replace(
              '"core/agent/src/BackendAgentHttpServer.cpp": [\n',
              '"core/agent/tests/test_backend_agent_command_client.cpp": [\n                  "completed_command_state_retired",\n                  "local_command_generation_fenced",\n              ],\n              "core/agent/src/BackendAgentHttpServer.cpp": [\n',
              1,
          )
          text = text.replace(
              'print("parameterized capability cleanup")\n',
              'print("parameterized capability cleanup")\nprint("replay counters expose durable acceptance evidence")\nprint("acknowledged stale generation state retires; pending state stays fenced")\n',
              1,
          )
          guard.write_text(text, encoding="utf-8")
          PY
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev libcrypt-dev libcurl4-openssl-dev
      - name: Run focused validation
        run: |
          make test-phase63-command-delivery-contract
          make test-phase63-command-delivery-runtime
          make test-backend-agent-client
          make backend-agent backend-agent-enrollment backend-agent-command-admin
          python3 tools/audit_make_test_inventory.py --check
          git diff --check
      - name: Publish and remove temporary workflows
        run: |
          rm -f .github/workflows/phase63-command-replay-evidence.yml
          rm -f .github/workflows/phase63-command-runtime-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden command replay evidence and restart fencing"
          git push origin HEAD:agent/phase63-command-delivery-runtime
