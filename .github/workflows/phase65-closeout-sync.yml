name: Phase 65 Closeout Sync

on:
  push:
    branches: [docs/phase65-final-closeout]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Run Phase 65 closeout sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase65-final-closeout
          fetch-depth: 0
      - name: Synchronize final Phase 65 closeout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('tools').resolve()))
          from phase_status_contract import CURRENT, replace_current_status_values
          from update_phase_status import replace_block_status, replace_inline_status, set_roadmap_section_status, roadmap_heading

          completed = 'Phase 65 - Streaming Gateway and Media Sessions'
          active = 'none - Phase 66 has not started'
          next_phase = 'Phase 66 - Broadcast Companion Services: Teletext and HbbTV'

          current = CURRENT.read_text(encoding='utf-8')
          CURRENT.write_text(replace_current_status_values(current, completed=completed, active=active, next_phase=next_phase), encoding='utf-8')
          for rel in ['docs/planning/roadmap.md', 'docs/planning/phase-map.md']:
              replace_block_status(Path(rel), completed, active, next_phase)
          for rel in ['docs/NEW-CHAT-HANDOFF.md', 'docs/development/current-status.md']:
              replace_inline_status(Path(rel), completed, active, next_phase)
          rp = Path('docs/planning/roadmap.md')
          text = rp.read_text(encoding='utf-8')
          text = set_roadmap_section_status(text, roadmap_heading(completed), 'Completed')
          text = set_roadmap_section_status(text, roadmap_heading(next_phase), 'Next; not started')
          rp.write_text(text, encoding='utf-8')

          def edit(rel, replacements=(), append=None):
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              if append and append not in text:
                  text = text.rstrip() + '\n\n' + append + '\n'
              p.write_text(text, encoding='utf-8')

          edit('docs/CURRENT.md', [('[Phase 65 Final Closeout](development/phase-65-closeout.md)', '[Phase 65 Closeout](development/phase-65-closeout.md)')])

          p = Path('docs/NEW-CHAT-HANDOFF.md')
          text = p.read_text(encoding='utf-8')
          if 'development/phase-65-closeout.md' not in text:
              anchor = '[Phase 64 Final Closeout](development/phase-64-closeout.md)'
              text = text.replace(anchor, anchor + ' and [Phase 65 Closeout](development/phase-65-closeout.md)', 1)
          for old, new in [
              ('Phase 65 is active. Phase 65.A through 65.C are closed for their accepted bounded scopes. Phase 65.D remains active with the accepted work listed above closed for its bounded scopes.', 'Phase 65 is completed. Phase 65.A through 65.D are closed for their accepted bounded scopes. Phase 66 has not started.'),
              ('The next coherent Phase-65.D work is the ADR-0056 semantic consolidation.', 'The mandatory ADR-0056 semantic consolidation is completed.'),
              ('Phase 65 Streaming Gateway and Media Sessions [ACTIVE]', 'Phase 65 Streaming Gateway and Media Sessions [COMPLETED]'),
              ('client playback abstraction [65.D ACTIVE]', 'client playback abstraction [65.D CLOSED]'),
              ('ADR-0056 playback semantic consolidation [ACTIVE]', 'ADR-0056 playback semantic consolidation [CLOSED]'),
              ('Treat Phase 64 as completed and Phase 65 as active with 65.A through 65.C closed and 65.D active.', 'Treat Phase 65 as completed and Phase 66 as not started.'),
          ]:
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          edit('docs/development/current-status.md', [
              ('Phase 65.D remains active.', 'Phase 65.D is completed.'),
              ('**Phase 65.D remains active.**', '**Phase 65.D is completed.**'),
          ], append='See [Phase 65 Closeout](phase-65-closeout.md).\n\nNext strict numbered runtime phase: **Phase 66 - Broadcast Companion Services: Teletext and HbbTV**. Phase 66 has not started and requires a separate explicit kickoff.')

          edit('docs/planning/roadmap.md', [
              ('#### 65.D — Client playback abstraction — ACTIVE', '#### 65.D — Client playback abstraction — CLOSED'),
              ('**ADR-0056 Playback semantic consolidation — ACTIVE**', '**ADR-0056 Playback semantic consolidation — CLOSED**'),
              ('Phase 65 - Streaming Gateway and Media Sessions [ACTIVE]', 'Phase 65 - Streaming Gateway and Media Sessions [COMPLETED]'),
              ('Phase 65 is already active. Phase 65.A through 65.C are closed for their bounded accepted scopes; Phase 65.D remains active under ADR-0056.', 'Phase 65 is completed. Phase 65.A through 65.D are closed for their bounded accepted scopes.'),
          ], append='[Phase 65 Closeout](../development/phase-65-closeout.md) records the final accepted Phase-65 boundary. Phase 66 is next but has not started; runtime requires a separate explicit kickoff.')

          edit('docs/planning/phase-map.md', [
              ('| 2 | Phase 65 | Active | Streaming Gateway and Media Sessions |', '| 2 | Phase 65 | Completed | Streaming Gateway and Media Sessions |'),
              ('| 3 | Phase 66 | Planned after Phase 65 |', '| 3 | Phase 66 | Next; not started |'),
              ('ADR-0056 semantic consolidation remains active.', 'ADR-0056 semantic consolidation is completed.'),
          ], append='[Phase 65 Closeout](../development/phase-65-closeout.md) is the durable completion record. Phase 66 has not started and requires a separate explicit kickoff.')
          edit('docs/index.md', append='- [Phase 65 Closeout](development/phase-65-closeout.md) — final accepted Streaming Gateway / MediaSession and playback-semantics boundary.')
          Path('.github/workflows/phase65-closeout-sync.yml').unlink()
          PY
      - name: Validate closeout documents
        shell: bash
        run: |
          python3 tools/check_phase_consistency.py
          python3 tools/check_completed_phase_markers.py
          python3 tools/check_phase_map_coverage.py
          python3 tools/check_doc_entrypoints.py
          python3 tools/check_docs.py
          python3 tools/check_doc_indexes.py
          python3 tools/check_doc_reachability.py
      - name: Commit closeout
        shell: bash
        run: |
          git config user.name hotzenplotz5
          git config user.email hotzenplotz5@gmx.de
          git add -A
          git commit -m "Synchronize final Phase 65 closeout"
          git push origin HEAD:docs/phase65-final-closeout
