name: Recording Fix Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-recording-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev

      - name: Check frontend syntax and ownership
        run: |
          node --check web/frontend/modules/recordings.js
          node --check web/frontend/api/client-api.js
          node --check web/frontend/app.js
          python3 tools/check_frontend_ownership_contracts.py

      - name: Run recording action controller regression
        run: make test-recording-action-execution-controller

      - name: Build daemon
        run: make daemon
