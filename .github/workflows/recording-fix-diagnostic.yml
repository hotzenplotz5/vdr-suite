name: Recording Fix Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture-fast-regression-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev

      - name: Capture fast regression output
        id: regression
        shell: bash
        run: |
          set +e
          make test-ci-fast > fast-regression.log 2>&1
          status=$?
          printf '%s\n' "$status" > fast-regression.status
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: recording-fix-fast-regression
          path: |
            fast-regression.log
            fast-regression.status
          if-no-files-found: error
          retention-days: 1

      - name: Preserve regression result
        shell: bash
        run: |
          status="$(cat fast-regression.status)"
          if [ "$status" -ne 0 ]; then
            tail -n 80 fast-regression.log
            exit "$status"
          fi
