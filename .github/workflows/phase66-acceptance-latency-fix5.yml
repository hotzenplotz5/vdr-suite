name: Phase66 settled-series latency repair

on:
  push:
    branches:
      - work/phase66-home-performance-pagination

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: allow any settled series metadata to release rail' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase66-home-performance-pagination
          fetch-depth: 0

      - name: Reapply representative scheduler
        shell: bash
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase66-acceptance-latency-fix3.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'phase66-fix3-patch', 'exec'))
          BOOT

      - name: Release series after any member metadata settles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/frontend/home-recording-discovery.js')
          text = path.read_text()
          old = """    const ready = new Set(cache.readySeriesKeys);\n    nativeBySeries.forEach(function (hasNativeId, key) {\n      if (!hasNativeId) ready.add(key);\n    });\n    return (recordings || []).filter(function (recording) {\n"""
          new = """    const ready = new Set(cache.readySeriesKeys);\n    (recordings || []).forEach(function (recording) {\n      const nativeId = recordingBackendNativeId(recording);\n      if (!nativeId || !cache.resolved.has(nativeId)) return;\n      const key = seriesMetadataPriorityKey(recording, backendId);\n      if (key) ready.add(key);\n    });\n    nativeBySeries.forEach(function (hasNativeId, key) {\n      if (!hasNativeId) ready.add(key);\n    });\n    return (recordings || []).filter(function (recording) {\n"""
          if text.count(old) != 1:
              raise SystemExit('ready-series block mismatch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Align production regression with background metadata convergence
        shell: bash
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase66-acceptance-latency-fix4.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'phase66-fix4-test-patch', 'exec'))
          BOOT

      - name: Run focused frontend regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check web/frontend/home-live-hero.js
          node --check web/frontend/home-recording-discovery.js
          node web/frontend/tests/test_phase66_live_tv_hero.js
          node web/frontend/tests/test_phase66_home_native_metadata_rails.js
          node web/frontend/tests/test_phase66_recording_discovery.js
          node web/frontend/tests/test_phase66_recording_discovery_progressive.js
          node web/frontend/tests/test_phase66_recording_discovery_contract.js
          git diff --check

      - name: Commit verified acceptance latency fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hotzenplotz5
          git config user.email hotzenplotz5@gmx.de
          git add web/frontend/home-live-hero.js \
                  web/frontend/home-recording-discovery.js \
                  web/frontend/tests/test_phase66_live_tv_hero.js \
                  web/frontend/tests/test_phase66_home_native_metadata_rails.js \
                  web/frontend/tests/test_phase66_recording_discovery.js
          git commit -m 'fix: remove Home EPG flash and prioritize series metadata'
          git push origin HEAD:work/phase66-home-performance-pagination
