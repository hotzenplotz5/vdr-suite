name: Phase66 Home performance apply

on:
  push:
    branches:
      - work/phase66-home-performance-pagination

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message != 'fix: paginate home rails and overlap metadata' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped Home performance patch
        run: |
          git show cd61cf13410684b12791dabcf8ffcb34dc9a06e3:.github/phase66_home_performance_patch.py > /tmp/phase66_home_performance_patch.py
          python3 - <<'PY'
          from pathlib import Path
          script_path = Path('/tmp/phase66_home_performance_patch.py')
          source = script_path.read_text()

          old_insert = '''replace_once(path,
          "  function installPlacementObserver() {",
          movies_more + "  function installPlacementObserver() {")'''
          new_insert = '''p = Path(path)
          value = p.read_text()
          marker = "  function installPlacementObserver() {"
          index = value.rfind(marker)
          if index < 0:
              raise SystemExit(f"{path}: installPlacementObserver marker not found")
          p.write_text(value[:index] + movies_more + value[index:])'''
          if source.count(old_insert) != 1:
              raise SystemExit('temporary patch-script insertion repair marker mismatch')
          source = source.replace(old_insert, new_insert, 1)

          old_bind = '''replace_once(path,
          "    installPlacementObserver();\\n    installModuleObserver();",
          "    installPlacementObserver();\\n    installModuleObserver();\\n    bindNearEnd();")'''
          new_bind = '''p = Path(path)
          value = p.read_text()
          marker = "    installPlacementObserver();\\n    installModuleObserver();"
          index = value.rfind(marker)
          if index < 0:
              raise SystemExit(f"{path}: recent-movies install marker not found")
          replacement = marker + "\\n    bindNearEnd();"
          p.write_text(value[:index] + replacement + value[index + len(marker):])'''
          if source.count(old_bind) != 1:
              raise SystemExit('temporary patch-script bind repair marker mismatch')
          source = source.replace(old_bind, new_bind, 1)

          old_loop = 'for (let number = 101; number <= 128; number += 1)'
          if source.count(old_loop) != 2:
              raise SystemExit('live-tv fixture loop marker mismatch')
          source = source.replace(old_loop, 'for (let number = 21; number <= 48; number += 1)')

          script_path.write_text(source)
          PY
          python3 /tmp/phase66_home_performance_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/frontend/tests/test_phase66_live_tv_hero.js')
          text = p.read_text()
          old = """  heroRoot.dispatch('touchstart', {touches: [{clientX: 210, clientY: 30}]});
          heroRoot.dispatch('touchend', {changedTouches: [{clientX: 105, clientY: 34}]});
          assert.strictEqual(hero.snapshot().selectedChannelId, 'C1');
          assert.strictEqual(hero.snapshot().currentEventTitle, 'Heute Eins');"""
          new = """  heroRoot.dispatch('touchstart', {touches: [{clientX: 210, clientY: 30}]});
          heroRoot.dispatch('touchend', {changedTouches: [{clientX: 105, clientY: 34}]});
          assert.strictEqual(hero.snapshot().selectedChannelId, 'C21');
          assert.strictEqual(hero.snapshot().currentEventTitle, 'Heute 21');"""
          if text.count(old) != 1:
              raise SystemExit('live-tv swipe expectation marker mismatch')
          text = text.replace(old, new, 1)
          old_watch = "  assert.strictEqual(window.lastStartedChannelId, 'C1');"
          if text.count(old_watch) != 1:
              raise SystemExit('live-tv watch expectation marker mismatch')
          text = text.replace(old_watch, "  assert.strictEqual(window.lastStartedChannelId, 'C21');", 1)
          p.write_text(text)
          PY

      - name: Run focused frontend regressions
        run: |
          node --check web/frontend/home-recording-discovery-bootstrap.js
          node --check web/frontend/home-recording-discovery.js
          node --check web/frontend/home-live-hero.js
          node --check web/frontend/home-recently-watched.js
          node web/frontend/tests/test_phase66_home_mouse_drag_rails.js
          node web/frontend/tests/test_phase66_home_native_metadata_rails.js
          node web/frontend/tests/test_phase66_live_tv_hero.js
          node web/frontend/tests/test_phase66_recent_movies_rail.js
          git diff --check

      - name: Commit verified product changes
        run: |
          git config user.name "hotzenplotz5"
          git config user.email "hotzenplotz5@gmx.de"
          git add \
            web/frontend/home-recording-discovery-bootstrap.js \
            web/frontend/home-recording-discovery.js \
            web/frontend/home-live-hero.js \
            web/frontend/home-recently-watched.js \
            web/frontend/tests/test_phase66_home_mouse_drag_rails.js \
            web/frontend/tests/test_phase66_home_native_metadata_rails.js \
            web/frontend/tests/test_phase66_live_tv_hero.js \
            web/frontend/tests/test_phase66_recent_movies_rail.js
          git diff --cached --quiet && { echo "No product changes produced"; exit 1; }
          git commit -m "fix: paginate home rails and overlap metadata"
          git push origin HEAD:work/phase66-home-performance-pagination
