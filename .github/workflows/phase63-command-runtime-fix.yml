name: Phase 63 command runtime focused fix

on:
  push:
    branches:
      - agent/phase63-command-delivery-runtime

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused linker and warning fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: replacement count for {old!r} is {text.count(old)}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "mk/agent-tests.mk",
              "\t\t$(AGENT_CLIENT_SRC) \\\n\t\t$(AGENT_CHANNEL_DOMAIN_SRC) \\\n\t\tcore/agent/tests/test_backend_agent_client.cpp \\\n",
              "\t\t$(AGENT_CLIENT_SRC) \\\n\t\t$(AGENT_CHANNEL_DOMAIN_SRC) \\\n\t\t$(AGENT_COMMAND_DOMAIN_SRC) \\\n\t\tcore/agent/tests/test_backend_agent_client.cpp \\\n",
          )
          replace_once(
              "mk/agent-tests.mk",
              "test-phase63-command-delivery-runtime:\n\tpython3 tools/check_phase63_command_delivery_runtime.py\n\t$(BUILD_CXX) $(CXXFLAGS) \\\n\t\t$(SQLITE_SRC) \\\n\t\tcore/security/src/AccountabilityEventRepository.cpp \\\n\t\tcore/vdr/src/VdrConfig.cpp \\\n",
              "test-phase63-command-delivery-runtime:\n\tpython3 tools/check_phase63_command_delivery_runtime.py\n\t$(BUILD_CXX) $(CXXFLAGS) \\\n\t\t$(SQLITE_SRC) \\\n\t\tcore/security/src/AccountabilityEventRepository.cpp \\\n\t\tcore/security/src/CredentialVerifierRepository.cpp \\\n\t\tcore/security/src/SecurityIdentityRepository.cpp \\\n\t\tcore/security/src/SecurityIdentityProvisioningRepository.cpp \\\n\t\tcore/vdr/src/VdrConfig.cpp \\\n",
          )
          replace_once(
              "mk/backend-agent-runtime.mk",
              "backend-agent-command-admin:\n\t$(BUILD_CXX) $(CXXFLAGS) \\\n\t\t$(SQLITE_SRC) \\\n\t\tcore/security/src/AccountabilityEventRepository.cpp \\\n\t\tcore/vdr/src/VdrConfig.cpp \\\n",
              "backend-agent-command-admin:\n\t$(BUILD_CXX) $(CXXFLAGS) \\\n\t\t$(SQLITE_SRC) \\\n\t\tcore/security/src/AccountabilityEventRepository.cpp \\\n\t\tcore/security/src/CredentialVerifierRepository.cpp \\\n\t\tcore/security/src/SecurityIdentityRepository.cpp \\\n\t\tcore/security/src/SecurityIdentityProvisioningRepository.cpp \\\n\t\tcore/vdr/src/VdrConfig.cpp \\\n",
          )
          replace_once(
              "core/agent/src/BackendAgentCommandDelivery.cpp",
              "    if(kind!=\"receipt\"&&kind!=\"result\")return false; const std::string column=kind==\"receipt\"?\"drop_next_receipt\":\"drop_next_result\";\n",
              "    if (kind != \"receipt\" && kind != \"result\") return false;\n    const std::string column = kind == \"receipt\"\n        ? \"drop_next_receipt\"\n        : \"drop_next_result\";\n",
          )
          replace_once(
              "core/agent/src/BackendAgentCommandDelivery.cpp",
              "    if(ok&&sqlite3_step(q)==SQLITE_ROW)armed=sqlite3_column_int(q,0)!=0; if(q)sqlite3_finalize(q);\n",
              "    if (ok && sqlite3_step(q) == SQLITE_ROW)\n        armed = sqlite3_column_int(q, 0) != 0;\n    if (q != nullptr) sqlite3_finalize(q);\n",
          )
          replace_once(
              "core/agent/src/BackendAgentCommandClient.cpp",
              "BackendAgentCommandClientContext normalized(const BackendAgentCommandClientContext& c){return c;}\n",
              "",
          )
          replace_once(
              "core/agent/src/BackendAgentCommandClient.cpp",
              "    if(!persist(config.statePath,state,reason))return false;return reconcileBackendAgentCommandState(config,context,transport,reason);\n",
              "    if (!persist(config.statePath, state, reason)) return false;\n    return reconcileBackendAgentCommandState(config, context, transport, reason);\n",
          )
          Path(".github/workflows/phase63-command-runtime-fix.yml").unlink()
          PY
      - name: Install focused build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev libcrypt-dev libcurl4-openssl-dev
      - name: Run focused command runtime validation
        shell: bash
        run: |
          make test-phase63-command-delivery-runtime || exit 1
          make backend-agent backend-agent-enrollment backend-agent-command-admin || exit 1
      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name hotzenplotz5
          git config user.email hotzenplotz5@gmx.de
          git add -A
          git commit -m "Fix command runtime source linkage"
          git push origin HEAD:agent/phase63-command-delivery-runtime
