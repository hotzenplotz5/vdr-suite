name: Documentation diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/check_doc*.py"
      - ".github/workflows/docs-diagnostics.yml"

permissions:
  contents: read

jobs:
  document-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Capture document format error
        shell: bash
        run: |
          set +e
          python3 tools/check_docs.py 2>&1 | tee /tmp/document-format.log
          status=${PIPESTATUS[0]}
          echo "DOCUMENT_FORMAT_STATUS=${status}"
          cat /tmp/document-format.log
          exit "${status}"

  document-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Capture document index error
        shell: bash
        run: |
          set +e
          python3 tools/check_doc_indexes.py 2>&1 | tee /tmp/document-index.log
          status=${PIPESTATUS[0]}
          echo "DOCUMENT_INDEX_STATUS=${status}"
          cat /tmp/document-index.log
          exit "${status}"
