name: Documentation diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/check_doc*.py"
      - "tools/check_phase*.py"
      - "tools/check_adr_index.py"
      - "tools/check_completed_phase_markers.py"
      - "tools/check_recent_doc_sync.py"
      - "mk/maintenance-tests.mk"
      - ".github/workflows/docs-diagnostics.yml"

permissions:
  contents: read

jobs:
  document-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_docs.py

  document-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_doc_indexes.py

  document-reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_doc_reachability.py

  document-entrypoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_doc_entrypoints.py

  adr-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_adr_index.py

  phase-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-phase
