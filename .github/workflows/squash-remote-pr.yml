name: Squash raster remote PR

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  squash:
    if: github.event.pull_request.head.ref == 'agent/photorealistic-jpg-remote'
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify final content
        shell: bash
        run: |
          set -euo pipefail
          node --check web/frontend/modules/remote.js
          node web/frontend/tests/test_remote_runtime.js
          git diff --check origin/main...HEAD

      - name: Replace intermediate history with one commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/squash-remote-pr.yml
          git reset --soft origin/main
          git add -A
          git commit -m "fix(frontend): use raster remote asset"
          git push --force-with-lease origin HEAD:"${BRANCH_NAME}"
