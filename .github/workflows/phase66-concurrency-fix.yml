name: Phase66 Home metadata concurrency fix

on:
  push:
    branches:
      - work/phase66-home-performance-pagination

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message != 'fix: bound Home metadata concurrency' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bound metadata concurrency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/frontend/home-recording-discovery.js')
          text = p.read_text()
          old = '  const SERIES_METADATA_TOTAL_CONCURRENCY = SERIES_METADATA_CONCURRENCY * 2;'
          new = '  const SERIES_METADATA_TOTAL_CONCURRENCY = SERIES_METADATA_CONCURRENCY;'
          if text.count(old) != 1:
              raise SystemExit('expected one metadata concurrency marker')
          p.write_text(text.replace(old, new, 1))
          PY
          node --check web/frontend/home-recording-discovery.js
          node web/frontend/tests/test_phase66_recording_discovery.js
          node web/frontend/tests/test_phase66_home_native_metadata_rails.js
          git diff --check
      - name: Commit verified concurrency fix
        run: |
          git config user.name "hotzenplotz5"
          git config user.email "hotzenplotz5@gmx.de"
          git add web/frontend/home-recording-discovery.js
          git diff --cached --quiet && { echo "No product change produced"; exit 1; }
          git commit -m "fix: bound Home metadata concurrency"
          git push origin HEAD:work/phase66-home-performance-pagination
