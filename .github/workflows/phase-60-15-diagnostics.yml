name: Phase 60.15 Failure Diagnostics

on:
  push:
    branches:
      - agent/phase-60-15h-i-recording-artwork-endpoint

permissions:
  contents: write

jobs:
  capture-failures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-60-15h-i-recording-artwork-endpoint

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make g++ sqlite3 libsqlite3-dev nodejs

      - name: Capture focused failures
        shell: bash
        run: |
          set +e
          make test-ci-frontend > /tmp/frontend.log 2>&1
          frontend_status=$?
          make test-recording-metadata-foundation > /tmp/cpp.log 2>&1
          cpp_status=$?
          {
            echo "frontend_exit=${frontend_status}"
            echo "cpp_exit=${cpp_status}"
            echo "=== FRONTEND TAIL ==="
            tail -n 160 /tmp/frontend.log
            echo "=== C++ TAIL ==="
            tail -n 220 /tmp/cpp.log
          } > phase-60-15-diagnostics.txt
          exit 0

      - name: Commit diagnostics and remove workflow
        run: |
          rm .github/workflows/phase-60-15-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase-60-15-diagnostics.txt
          git add -u .github/workflows
          git commit -m "Diagnostics: capture Phase 60.15 failures"
          git push origin HEAD:agent/phase-60-15h-i-recording-artwork-endpoint
