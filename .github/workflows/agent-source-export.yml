name: Apply Phase 63 backend-health runtime

on:
  push:
    branches:
      - agent/phase63-backend-health-ingestion-runtime

permissions:
  contents: write

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified runtime patch
        shell: bash
        run: |
          cat .github/phase63-runtime-chunk-00 .github/phase63-runtime-chunk-01 .github/phase63-runtime-chunk-02 .github/phase63-runtime-chunk-03 .github/phase63-runtime-chunk-04 > /tmp/phase63-runtime.b64
          echo "54eb55f5320c1feab3b55929c9331f143eae2278ab9c10356772ba95c027a76b  /tmp/phase63-runtime.b64" | sha256sum --check --strict
          base64 -d /tmp/phase63-runtime.b64 | gzip -d > /tmp/phase63-backend-health-runtime.patch
          echo "ca54f8f66bd32441a92fc66d500c190d13563b7cb403b2e9374cb8d087664c73  /tmp/phase63-backend-health-runtime.patch" | sha256sum --check --strict
          git apply --index /tmp/phase63-backend-health-runtime.patch
          git rm .github/workflows/agent-source-export.yml
          git rm .github/phase63-backend-health-runtime.patch.gz.b64
          git rm .github/phase63-runtime-chunk-00 .github/phase63-runtime-chunk-01 .github/phase63-runtime-chunk-02 .github/phase63-runtime-chunk-03 .github/phase63-runtime-chunk-04
          git diff --cached --check
      - name: Commit durable implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add backend health observation ingestion runtime"
          git push origin HEAD:agent/phase63-backend-health-ingestion-runtime
