name: Apply Phase 63 channel observation runtime

on:
  push:
    branches:
      - agent/phase63-channel-observation-runtime

permissions:
  contents: write

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified runtime patch
        shell: bash
        run: |
          cat .github/phase63-channel-runtime.patch.gz.b64.part-* > /tmp/phase63-channel-runtime.patch.gz.b64
          echo "ccfa75553511525ad59c7bf44c738d19963e58bf8e7b70fe886c1d241aa45feb  /tmp/phase63-channel-runtime.patch.gz.b64" | sha256sum --check --strict
          base64 -d /tmp/phase63-channel-runtime.patch.gz.b64 | gzip -d > /tmp/phase63-channel-runtime.patch
          echo "0d7669ddc3efa17bda04dc8dc8867f29574df2c32547332bd61146deb5641ce4  /tmp/phase63-channel-runtime.patch" | sha256sum --check --strict
          git apply --index /tmp/phase63-channel-runtime.patch
          git rm .github/workflows/agent-source-export.yml
          git rm .github/phase63-channel-runtime.patch.gz.b64.part-*
          git diff --cached --check
      - name: Commit durable implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add read-only channel observation runtime"
          git push origin HEAD:agent/phase63-channel-observation-runtime
