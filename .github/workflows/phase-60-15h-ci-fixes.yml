name: Phase 60.15h CI Fixes

on:
  push:
    branches:
      - agent/phase-60-15h-i-recording-artwork-endpoint

permissions:
  contents: write

jobs:
  apply-proven-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-60-15h-i-recording-artwork-endpoint

      - name: Apply exact proven fixes
        run: python3 tools/apply_phase_60_15h_ci_fixes.py

      - name: Commit fixes and cleanup diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/vdr/src/VdrRecordingArtworkService.cpp
          git add tools/check_frontend_ownership_contracts.py
          git add -u phase-60-15-diagnostics.txt .github/workflows tools
          git diff --cached --check
          git commit -m "Phase 60.15h: fix artwork CI contracts"
          git push origin HEAD:agent/phase-60-15h-i-recording-artwork-endpoint
