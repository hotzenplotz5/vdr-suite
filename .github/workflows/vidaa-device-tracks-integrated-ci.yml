name: VIDAA Device tracks + index + SRT focused CI

on:
  push:
    branches:
      - "work/vidaa-device-tracks-index-srt-webvtt-integrated-20261011"

permissions:
  contents: read

jobs:
  device-tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run existing Device, Recording, index and security contracts
        run: |
          set -euo pipefail
          make -j2 --output-sync=target \
            test-phase65d-recording-media-track-contract \
            test-phase65d-recording-subtitle-sidecar \
            test-phase65d-recording-subtitle-webvtt \
            test-phase65d-recording-audio-track-preference-parser \
            test-phase65d-recording-subtitle-track-selection-request-parser \
            test-security-http-gate \
            test-public-recording-device-media-session-response
