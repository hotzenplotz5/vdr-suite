name: Make Audit Maintenance Once

on:
  push:
    branches:
      - agent/make-test-infrastructure

permissions:
  contents: write

concurrency:
  group: make-audit-maintenance-once
  cancel-in-progress: true

jobs:
  harden-audit-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: agent/make-test-infrastructure
          fetch-depth: 0

      - name: Expand Make variables and classify intentional runtime sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/check_make_test_manifest.py")
          text = path.read_text(encoding="utf-8")

          old = '''REQUIRED_REACHABILITY = {
              "test-ci-fast": {
                  "test-make-test-manifest",
                  "test-restfulapi-recording-trash-contract",
                  "test-recording-mutation-safety-policy",
                  "test-systemd-unit-contract",
              },
              "test-ci-frontend": {"test-frontend-contracts"},
              "test-ci-packaging": {
                  "test-install-staging",
                  "test-systemd-unit-contract",
              },
              "test-all": {
                  "test",
                  "test-vdr",
                  "test-ci-frontend",
                  "test-ci-packaging",
                  "test-make-test-manifest",
              },
          }

          TARGET_RE = re.compile(r"^([A-Za-z0-9_.%/+\\-]+(?:\\s+[A-Za-z0-9_.%/+\\-]+)*)\\s*:(?!=)\\s*(.*)$")
          SOURCE_RE = re.compile(r"(?:^|\\s)((?:api|core|web)/[^\\s\\\\]+/test_[^\\s\\\\]+\\.(?:cpp|js))")
          ASSIGNMENT_RE = re.compile(r"^([A-Za-z0-9_]+)\\s*(?::=|=|\\+=|\\?=)\\s*(.*)$")
          '''

          new = '''REQUIRED_REACHABILITY = {
              "test-ci-fast": {
                  "test-make-test-manifest",
                  "test-restfulapi-recording-trash-contract",
                  "test-recording-mutation-safety-policy",
                  "test-systemd-unit-contract",
              },
              "test-ci-frontend": {"test-frontend-contracts"},
              "test-ci-packaging": {
                  "test-install-staging",
                  "test-systemd-unit-contract",
              },
              "test-all": {
                  "test",
                  "test-vdr",
                  "test-ci-frontend",
                  "test-ci-packaging",
                  "test-make-test-manifest",
              },
          }

          INTENTIONAL_RUNTIME_AGGREGATES = {
              (
                  "DAEMON_SRC",
                  "core/http/src/TestHttpServer.cpp",
              ): "legacy-named production HTTP dispatcher used by DaemonRuntime",
              (
                  "VDR_SRC",
                  "core/vdr/src/MockVdrAdapter.cpp",
              ): "explicit mock adapter mode provided by VdrAdapterFactory",
              (
                  "VDR_SRC",
                  "core/vdr/src/TestLiveTransport.cpp",
              ): "explicit test transport mode provided by LiveTransportFactory",
          }

          TARGET_RE = re.compile(r"^([A-Za-z0-9_.%/+\\-]+(?:\\s+[A-Za-z0-9_.%/+\\-]+)*)\\s*:(?!=)\\s*(.*)$")
          SOURCE_RE = re.compile(r"(?:^|\\s)((?:api|core|web)/[^\\s\\\\]+/test_[^\\s\\\\]+\\.(?:cpp|js))")
          ASSIGNMENT_RE = re.compile(r"^([A-Za-z0-9_]+)\\s*(?::=|=|\\+=|\\?=)\\s*(.*)$")
          VARIABLE_ASSIGNMENT_RE = re.compile(
              r"^([A-Za-z0-9_]+)\\s*(\\+=|:=|=|\\?=)\\s*(.*)$"
          )
          VARIABLE_REFERENCE_RE = re.compile(r"^\\$\\(([A-Za-z0-9_]+)\\)$")
          '''

          if old not in text:
              raise SystemExit("Expected constants block not found")
          text = text.replace(old, new, 1)

          old = '''def dependency_tokens(text: str) -> set[str]:
              result: set[str] = set()
              for token in text.split():
                  if token == "|":
                      continue
                  if "$" in token or "%" in token or "=" in token:
                      continue
                  if token.startswith("#"):
                      break
                  result.add(token)
              return result
          '''

          new = '''def parse_make_variables(paths: Iterable[Path]) -> dict[str, list[str]]:
              variables: dict[str, list[str]] = {}
              for path in paths:
                  lines = path.read_text(encoding="utf-8").splitlines()
                  for line in logical_lines(lines):
                      match = VARIABLE_ASSIGNMENT_RE.match(line.strip())
                      if not match:
                          continue
                      name, operator, value = match.groups()
                      tokens = value.split()
                      if operator == "+=":
                          variables.setdefault(name, []).extend(tokens)
                      elif operator == "?=":
                          variables.setdefault(name, tokens)
                      else:
                          variables[name] = tokens
              return variables


          def dependency_tokens(
              text: str,
              variables: dict[str, list[str]],
          ) -> set[str]:
              result: set[str] = set()
              queue = deque(text.split())
              expanded_variables: set[str] = set()

              while queue:
                  token = queue.popleft()
                  if token == "|":
                      continue
                  if token.startswith("#"):
                      break

                  variable_match = VARIABLE_REFERENCE_RE.match(token)
                  if variable_match:
                      variable_name = variable_match.group(1)
                      if variable_name in expanded_variables:
                          continue
                      expanded_variables.add(variable_name)
                      queue.extendleft(reversed(variables.get(variable_name, [])))
                      continue

                  if "$" in token or "%" in token or "=" in token:
                      continue
                  result.add(token)

              return result
          '''

          if old not in text:
              raise SystemExit("Expected dependency_tokens block not found")
          text = text.replace(old, new, 1)

          old = '''    graph: dict[str, set[str]] = defaultdict(set)
              definitions: DefaultDict[str, list[Path]] = defaultdict(list)

              for path in paths:
          '''
          new = '''    graph: dict[str, set[str]] = defaultdict(set)
              definitions: DefaultDict[str, list[Path]] = defaultdict(list)
              variables = parse_make_variables(paths)

              for path in paths:
          '''
          if old not in text:
              raise SystemExit("Expected parse_targets initialization not found")
          text = text.replace(old, new, 1)

          old = '''            prerequisites = dependency_tokens(prerequisites_text)
          '''
          new = '''            prerequisites = dependency_tokens(
                      prerequisites_text,
                      variables,
                  )
          '''
          if old not in text:
              raise SystemExit("Expected prerequisite parser call not found")
          text = text.replace(old, new, 1)

          old = '''            if basename.startswith(("Mock", "Test")):
                          production_leaks.append(f"{name}: {source}")
          '''
          new = '''            if (
                          basename.startswith(("Mock", "Test"))
                          and (name, source) not in INTENTIONAL_RUNTIME_AGGREGATES
                      ):
                          production_leaks.append(f"{name}: {source}")
          '''
          if old not in text:
              raise SystemExit("Expected production aggregate check not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python3 -m py_compile tools/check_make_test_manifest.py
          python3 tools/check_make_test_manifest.py --strict

      - name: Commit parser hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check_make_test_manifest.py
          git diff --cached --check
          git commit -m "Build: make test inventory strict and variable-aware"
          git push origin HEAD:agent/make-test-infrastructure
