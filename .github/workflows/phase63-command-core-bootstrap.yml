name: Phase63 command core bootstrap

on:
  push:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate
        run: python3 tools/bootstrap_phase63_command_core.py
      - name: Test
        run: make test-backend-agent-command-delivery
      - name: Check
        run: git diff --check
      - name: Publish
        run: |
          git config user.name hotzenplotz5
          git config user.email hotzenplotz5@gmx.de
          git add core/agent/src/BackendAgentCommandDelivery.cpp mk/agent-sources.mk mk/agent-tests.mk
          git commit -m "Integrate durable Agent command delivery core"
          git rm .github/workflows/phase63-command-core-bootstrap.yml tools/bootstrap_phase63_command_core.py
          git commit -m "Remove command core bootstrap helpers"
          git push origin HEAD:agent/phase63-command-delivery-core
