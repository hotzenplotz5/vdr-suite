name: Phase63 command core bootstrap

on:
  push:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate checkout
        shell: bash
        run: |
          test "$(git branch --show-current)" = "agent/phase63-command-delivery-core"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo bootstrap-ready
