name: Repair Audit Documentation Index

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-development-index:
    if: github.head_ref == 'agent/architecture-audit-adrs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Add architecture audit link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/development/index.md')
          text = path.read_text(encoding='utf-8')
          marker = '- [Current Architecture State](current-architecture-state.md)\n'
          addition = '- [Architecture Source Audit - 2026-07-15](architecture-source-audit-2026-07-15.md)\n'

          if addition not in text:
              assert marker in text
              text = text.replace(marker, marker + addition, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit index repair
        run: |
          if git diff --quiet -- docs/development/index.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/index.md
          git commit -m "Docs: index completed architecture audit"
          git push origin HEAD:agent/architecture-audit-adrs
