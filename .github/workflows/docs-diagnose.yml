name: Inspect Documentation Aggregate

on:
  pull_request:

jobs:
  docs-inspect:
    if: github.head_ref == 'agent/architecture-audit-adrs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Capture aggregate commands and output
        run: |
          set +e
          make -n test-docs > docs-aggregate.log 2>&1
          echo >> docs-aggregate.log
          echo '=== actual ===' >> docs-aggregate.log
          make test-docs >> docs-aggregate.log 2>&1
          echo "exit=$?" >> docs-aggregate.log
      - name: Upload aggregate diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: docs-aggregate-log
          path: docs-aggregate.log
