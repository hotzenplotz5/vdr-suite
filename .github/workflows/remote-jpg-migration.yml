          assert(source.includes("x.classList.add('brand-feature-remote')"));assert(source.includes("x.setAttribute('aria-label','VDR - Fernbedienung öffnen')"));assert(source.includes("el('h2','','VDR - Fernbedienung')"));assert(source.includes("v.setAttribute('aria-label','VDR - Fernbedienung')"));assert(source.includes("t.textContent='VDR - Fernbedienung'"));
          const serverPaths=fs.readFileSync(path.join(__dirname,'..','..','..','core','http','src','TestHttpServerPaths.inc'),'utf8'),liveRemoteMake=fs.readFileSync(path.join(__dirname,'..','..','..','mk','live-remote.mk'),'utf8');assert(serverPaths.includes('{"/frontend/app.js", "app.js", "application/javascript; charset=utf-8", "modules/remote.js"}'));assert(serverPaths.includes('{"/frontend/api/client-api.js", "api/client-api.js", "application/javascript; charset=utf-8", "api/live-remote-client-api.js"}'));assert(liveRemoteMake.includes('web/frontend/modules/remote.js'));assert(liveRemoteMake.includes('web/frontend/api/live-remote-client-api.js'));assert(liveRemoteMake.includes('web/frontend/assets/vdr-remote-photorealistic.jpg'));assert(!liveRemoteMake.includes('vdr-remote-photorealistic.svg'));
          const document={head:{appendChild:function(){}},body:{append:function(){}},createElement:function(tag){return{tagName:tag.toUpperCase(),dataset:{},style:{},classList:{add:function(){},remove:function(){},toggle:function(){}},setAttribute:function(){},getAttribute:function(){return null},removeAttribute:function(){},appendChild:function(){},append:function(){},addEventListener:function(){},querySelector:function(){return null},querySelectorAll:function(){return[]}}},querySelector:function(){return null},querySelectorAll:function(){return[]},getElementById:function(){return null},addEventListener:function(){}};
          const requests=[],baseApi=Object.freeze({requestJson:function(url,options){requests.push({url:url,options:options});return Promise.resolve({success:true})},fetchClientBackends:function(){return Promise.resolve({backends:[]})}}),context={window:null,document:document,console:console,Date:Date,JSON:JSON,Object:Object,Promise:Promise,Set:Set,URLSearchParams:URLSearchParams,setTimeout:setTimeout,clearTimeout:clearTimeout,VdrSuiteClientApi:baseApi};context.window=context;vm.createContext(context);vm.runInContext(clientSource,context);vm.runInContext(source,context);
          assert(context.VdrSuiteRemote);assert.strictEqual(context.VdrSuiteRemote.remoteImagePath,'/channel-logos/vdr-suite-brand/vdr-remote-photorealistic.jpg');assert.strictEqual(context.VdrSuiteRemote.hotspotCount,35);assert.deepStrictEqual(Array.from(context.VdrSuiteRemote.actions),['up','down','left','right','ok','back','menu','info','red','green','yellow','blue','zero','one','two','three','four','five','six','seven','eight','nine','channelUp','channelDown','volumeUp','volumeDown','mute','play','pause','stop','record','fastForward','rewind','next','previous','switchChannel']);assert.strictEqual(typeof context.VdrSuiteClientApi.fetchClientRemoteAction,'function');assert.strictEqual(typeof context.VdrSuiteClientApi.fetchClientLiveOverlay,'function');assert.strictEqual(context.VdrSuiteRemote.canControlBackend({enabled:true,online:true,frontendSelector:{canWrite:false},capabilities:{remoteControl:true}}),false);assert.strictEqual(context.VdrSuiteRemote.canControlBackend({enabled:true,online:true,frontendSelector:{canWrite:true},capabilities:{remoteControl:true}}),true);
          context.VdrSuiteClientApi.fetchClientRemoteAction({payload:{backendId:'default',operationId:'remote-1',action:'ok'}});context.VdrSuiteClientApi.fetchClientLiveOverlay({backendId:'default'});assert.strictEqual(requests[0].url,'/api/vdr/remote/actions');assert.strictEqual(requests[0].options.method,'POST');assert.strictEqual(requests[1].url,'/api/vdr/live/overlay');console.log('remote frontend contract ok');
