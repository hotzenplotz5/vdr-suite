name: Finalize photorealistic JPG remote

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Extract real JPEG and patch runtime paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          svg_path = Path('web/frontend/assets/vdr-remote-photorealistic.svg')
          jpg_path = Path('web/frontend/assets/vdr-remote-photorealistic.jpg')
          source = svg_path.read_text(encoding='utf-8')
          payload = source.split('data:image/jpeg;base64,', 1)[1].split('"', 1)[0]
          jpg_path.write_bytes(base64.b64decode(payload))
          svg_path.unlink()
          PY
          sed -i 's/vdr-remote-photorealistic\.svg/vdr-remote-photorealistic.jpg/g' web/frontend/modules/remote.js mk/live-remote.mk
          sed -i 's/width:min(23rem,88vw)/width:min(19rem,72vw)/' web/frontend/modules/remote.js

      - name: Run requested frontend checks
        shell: bash
        run: |
          set -euo pipefail
          node --check web/frontend/modules/remote.js
          node web/frontend/tests/test_remote_runtime.js
          git diff --check

      - name: Publish final migration commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remote-jpg-migration.yml
          git add -A
          git commit --amend -m "fix(frontend): use raster remote asset"
          git push --force-with-lease origin HEAD:"${BRANCH_NAME}"
