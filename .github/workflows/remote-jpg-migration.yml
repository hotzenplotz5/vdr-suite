          assert(!source.includes('/remote/seq'));assert(!source.includes('/remote/kbd'));assert(!source.includes('/osd'));assert(!source.includes('restfulapi'));assert(!source.includes('/api/vdr/remote/actions'));assert(!source.includes('/api/vdr/live/overlay'));assert(clientSource.includes("'/api/vdr/remote/actions'"));assert(clientSource.includes("'/api/vdr/live/overlay'"));assert(clientSource.includes("'/api/vdr/live'"));
          assert(source.includes("P='/channel-logos/vdr-suite-brand/vdr-remote-photorealistic.jpg'"));assert(!source.includes('vdr-remote-photorealistic.svg'));assert(!source.includes('data:image/'));assert(!source.includes('<image'));assert(source.includes("el('section','rst')"));assert(source.includes("el('img','rpi')"));assert(source.includes("el('button','rpk')"));assert(source.includes("s.setAttribute('aria-label','Fotorealistische VDR-Fernbedienung')"));assert(source.includes("z.textContent='Fotorealistisch · scrollbar'"));
