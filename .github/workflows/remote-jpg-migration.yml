name: Finalize photorealistic JPG remote

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Extract JPEG and patch runtime files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          svg_path = Path('web/frontend/assets/vdr-remote-photorealistic.svg')
          jpg_path = Path('web/frontend/assets/vdr-remote-photorealistic.jpg')
          remote_path = Path('web/frontend/modules/remote.js')
          make_path = Path('mk/live-remote.mk')

          svg = svg_path.read_text(encoding='utf-8')
          match = re.search(r'data:image/jpeg;base64,([^"\s]+)', svg)
          if not match:
              raise SystemExit('embedded JPEG not found in existing SVG wrapper')
          jpeg = base64.b64decode(match.group(1), validate=True)
          if not (jpeg.startswith(b'\xff\xd8') and jpeg.endswith(b'\xff\xd9')):
              raise SystemExit('decoded asset is not a complete JPEG')

          def jpeg_dimensions(data):
              sof_markers = {0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7, 0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF}
              pos = 2
              while pos + 9 <= len(data):
                  if data[pos] != 0xFF:
                      pos += 1
                      continue
                  while pos < len(data) and data[pos] == 0xFF:
                      pos += 1
                  if pos >= len(data):
                      break
                  marker = data[pos]
                  pos += 1
                  if marker in {0x01, 0xD8, 0xD9} or 0xD0 <= marker <= 0xD7:
                      continue
                  if pos + 2 > len(data):
                      break
                  length = int.from_bytes(data[pos:pos + 2], 'big')
                  if length < 2 or pos + length > len(data):
                      break
                  if marker in sof_markers:
                      return (
                          int.from_bytes(data[pos + 5:pos + 7], 'big'),
                          int.from_bytes(data[pos + 3:pos + 5], 'big'),
                      )
                  pos += length
              raise SystemExit('JPEG dimensions not found')

          dimensions = jpeg_dimensions(jpeg)
          if dimensions != (360, 1220):
              raise SystemExit(f'unexpected JPEG dimensions: {dimensions!r}')
          jpg_path.write_bytes(jpeg)
          svg_path.unlink()

          remote = remote_path.read_text(encoding='utf-8')
          old_path = "P='/channel-logos/vdr-suite-brand/vdr-remote-photorealistic.svg'"
          new_path = "P='/channel-logos/vdr-suite-brand/vdr-remote-photorealistic.jpg'"
          if remote.count(old_path) != 1:
              raise SystemExit('unexpected remote asset path count')
          if remote.count('width:min(23rem,88vw)') != 1:
              raise SystemExit('unexpected remote width count')
          remote = remote.replace(old_path, new_path, 1)
          remote = remote.replace('width:min(23rem,88vw)', 'width:min(19rem,72vw)', 1)
          remote_path.write_text(remote, encoding='utf-8')

          make_source = make_path.read_text(encoding='utf-8')
          if make_source.count('vdr-remote-photorealistic.svg') != 2:
              raise SystemExit('unexpected SVG install path count')
          make_path.write_text(
              make_source.replace('vdr-remote-photorealistic.svg', 'vdr-remote-photorealistic.jpg'),
              encoding='utf-8',
          )
          print(f'created {jpg_path} ({len(jpeg)} bytes, {dimensions[0]}x{dimensions[1]})')
          PY

      - name: Replace frontend contract test
        shell: bash
        run: |
          cat > web/frontend/tests/test_remote_runtime.js <<'EOF'
