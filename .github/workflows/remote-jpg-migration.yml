          const remoteAssetPath=path.join(__dirname,'..','assets','vdr-remote-photorealistic.jpg');
          const remoteSvgPath=path.join(__dirname,'..','assets','vdr-remote-photorealistic.svg');
          const remoteAsset=fs.readFileSync(remoteAssetPath),remoteAssetText=remoteAsset.toString('latin1');
