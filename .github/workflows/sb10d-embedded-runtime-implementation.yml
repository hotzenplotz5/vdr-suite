name: SB.10d embedded runtime implementation

on:
  pull_request:
    branches:
      - feature/vdr-plugin-suite-bridge-foundation
    paths:
      - .github/sb10d-implementation-trigger

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Check out SB.10d implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/sb10d-embedded-runtime-integration
          fetch-depth: 1
          show-progress: false

      - name: Apply SB.10d implementation
        run: python3 tools/run_sb10d_embedded_runtime.py

      - name: Compile boundary tools
        run: |
          python3 -m py_compile tools/check_suite_bridge_embedded_runtime_boundary.py
          python3 -m py_compile tools/check_suite_bridge_daemon_runtime_wiring.py

      - name: Check Make inventory
        run: make test-make-inventory

      - name: Check retained Suite Bridge contracts
        run: |
          make test-suite-bridge-agent-boundary
          make test-suite-bridge-handshake
          make test-suite-bridge-svdrp-transport-boundary
          make test-suite-bridge-svdrp-transport
          make test-suite-bridge-observation-boundary
          make test-suite-bridge-observation-service
          make test-suite-bridge-observation-worker

      - name: Check SB.10d embedded runtime boundary
        run: make test-suite-bridge-embedded-runtime-boundary

      - name: Check SB.10d embedded runtime behavior
        run: make test-suite-bridge-embedded-runtime

      - name: Check SB.10d daemon wiring
        run: make test-suite-bridge-daemon-runtime-wiring

      - name: Check SB.10d RuntimeConfig
        run: make test-runtime-config

      - name: Check backend runtime context
        id: backend_context
        continue-on-error: true
        run: make test-backend-runtime-context > /tmp/sb10d-backend-runtime-context.log 2>&1

      - name: Upload backend runtime context failure evidence
        if: steps.backend_context.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sb10d-backend-runtime-context-failure
          path: /tmp/sb10d-backend-runtime-context.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce backend runtime context result
        if: steps.backend_context.outcome == 'failure'
        run: exit 1

      - name: Build daemon
        run: make daemon

      - name: Check documentation and architecture
        run: |
          make test-docs
          make test-architecture
          git diff --check

      - name: Remove one-time implementation helpers
        run: |
          rm tools/apply_sb10d_embedded_runtime.py
          rm tools/run_sb10d_embedded_runtime.py
          rm .github/sb10d-implementation-trigger

      - name: Commit SB.10d implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "SB.10d: integrate embedded Suite Bridge Agent runtime"
          git push origin HEAD:agent/sb10d-embedded-runtime-integration
